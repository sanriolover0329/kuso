function changeMyPassword() {
  const cur  = document.getElementById('accCurPwd').value;
  const newP = document.getElementById('accNewPwd').value;
  const newP2 = document.getElementById('accNewPwd2').value;
  const msgEl = document.getElementById('accMsg');
  const u = shopDB.users.find(x => x.id === currentUser.id);
  if (!u) return;
  if (!cur)  { msgEl.innerHTML = '<span style="color:var(--accent-dark)">請輸入目前密碼</span>'; return; }
  if (u.pwd !== cur) { msgEl.innerHTML = '<span style="color:var(--accent-dark)">目前密碼錯誤</span>'; return; }
  if (!newP || newP.length < 6) { msgEl.innerHTML = '<span style="color:var(--accent-dark)">新密碼至少需要6碼</span>'; return; }
  if (newP !== newP2) { msgEl.innerHTML = '<span style="color:var(--accent-dark)">兩次輸入的密碼不同</span>'; return; }
  u.pwd = newP;
  saveShopDB();
  document.getElementById('accCurPwd').value = '';
  document.getElementById('accNewPwd').value = '';
  document.getElementById('accNewPwd2').value = '';
  msgEl.innerHTML = '<span style="color:var(--success)">✅ 密碼已更新</span>';
}


// ═══════════════════════════════════════
var appliedCoupon = null;

function applyCoupon() {
  var code = (document.getElementById('couponInput') ? document.getElementById('couponInput').value : '').trim().toUpperCase();
  var resultEl = document.getElementById('couponResult');
  if (!code) { if (resultEl) resultEl.innerHTML = ''; appliedCoupon = null; return; }
  var coupons = shopDB.coupons || [];
  var coupon = coupons.find(function(c) { return c.code === code && c.active; });
  if (!coupon) { if (resultEl) resultEl.innerHTML = '<span style="color:var(--accent-dark)">❌ 折扣碼無效或已停用</span>'; return; }
  if (coupon.expiry && new Date(coupon.expiry) < new Date()) {
    if (resultEl) resultEl.innerHTML = '<span style="color:var(--accent-dark)">❌ 此折扣碼已過期</span>'; return;
  }
  if (coupon.maxUse > 0 && (coupon.usedCount || 0) >= coupon.maxUse) {
    if (resultEl) resultEl.innerHTML = '<span style="color:var(--accent-dark)">❌ 此折扣碼已達使用上限</span>'; return;
  }
  var subtotal = 0;
  cart.forEach(function(item) { subtotal += getEffectivePrice(item.id, item.qty) * item.qty; });
  if (coupon.minSpend > 0 && subtotal < coupon.minSpend) {
    if (resultEl) resultEl.innerHTML = '<span style="color:var(--accent-dark)">❌ 需消費滿 ' + fmt(coupon.minSpend) + ' 才能使用</span>'; return;
  }
  appliedCoupon = coupon;
  var discLabel = coupon.type === 'percent' ? coupon.value + '% 折扣' : '折抵 ' + fmt(coupon.value);
  if (resultEl) resultEl.innerHTML = '<span style="color:var(--success)">✅ 折扣碼已套用：' + discLabel + '</span>';
  renderCartModal();
  setTimeout(function() {
    var inp = document.getElementById('couponInput');
    if (inp) inp.value = code;
    var res = document.getElementById('couponResult');
    if (res) res.innerHTML = '<span style="color:var(--success)">✅ 折扣碼已套用：' + discLabel + '</span>';
  }, 50);
}

function calcCouponDiscount(subtotal) {
  if (!appliedCoupon) return 0;
  if (appliedCoupon.type === 'percent') return Math.round(subtotal * appliedCoupon.value / 100);
  return Math.min(appliedCoupon.value, subtotal);
}

function removeCoupon() {
  appliedCoupon = null;
  renderCartModal();
  showToast('已移除優惠券');
}

// ═══════════════════════════════════════
// 數量限制驗證
// ═══════════════════════════════════════
function checkQtyLimits(pid, qty) {
  var s = shopDB.settings || {};
  var pp = shopDB.productPrices[pid] || {};
  var min = pp.minQty || s.globalMinQty || 0;
  var max = pp.maxQty || s.globalMaxQty || 0;
  if (min > 0 && qty < min) return '最少需購買 ' + min + ' 件';
  if (max > 0 && qty > max) return '單次最多購買 ' + max + ' 件';
  return null;
}

// 下單成功彈窗（含聯絡資訊）
// ═══════════════════════════════════════
function showOrderSuccess(order) {
  const ci = shopDB.contactInfo || {};
  const hasContact = ci.showAfterOrder !== false && (
    (ci.line   && ci.line.enabled)   ||
    (ci.lineat && ci.lineat.enabled) ||
    (ci.fb     && ci.fb.enabled)     ||
    (ci.phone  && ci.phone.enabled)
  );

  const shippingNote = order.shippingFee > 0
    ? `<div style="font-size:11px;color:var(--text3);margin-top:2px">（含運費 ${fmt(order.shippingFee)}）</div>` : '';
  const amountLine = order.isPreorder
    ? `<div style="font-size:13px;color:var(--text2);margin-bottom:4px">今日應付訂金：<strong style="color:var(--accent-dark);font-size:16px">${fmt(order.deposit)}</strong></div>
       <div style="font-size:11px;color:var(--text3)">餘款 ${fmt(order.finalTotal - order.deposit)} 待出貨前聯繫付清</div>${shippingNote}`
    : `<div style="font-size:13px;color:var(--text2)">訂單金額：<strong style="color:var(--accent-dark);font-size:16px">${fmt(order.finalTotal)}</strong></div>${shippingNote}`;

  let contactHtml = '';
  if (hasContact) {
    contactHtml = `<div style="margin-top:16px;padding-top:16px;border-top:1.5px dashed var(--border)">
      <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px">📬 請透過以下方式聯繫確認</div>`;

    if (ci.line && ci.line.enabled && ci.line.id) {
      const lineUrl = `https://line.me/ti/p/~${ci.line.id}`;
      contactHtml += `<a href="${lineUrl}" target="_blank" class="contact-btn line-btn">
        <span class="btn-icon">💚</span>
        <div><div>LINE 私訊</div><div class="btn-label">@${ci.line.id}</div></div>
      </a>`;
    }
    if (ci.lineat && ci.lineat.enabled && ci.lineat.url) {
      contactHtml += `<a href="${ci.lineat.url}" target="_blank" class="contact-btn line-btn">
        <span class="btn-icon">💚</span>
        <div><div>LINE@ 官方帳號</div><div class="btn-label">點此加入聯繫</div></div>
      </a>`;
    }
    if (ci.fb && ci.fb.enabled && ci.fb.url) {
      contactHtml += `<a href="${ci.fb.url}" target="_blank" class="contact-btn fb-btn">
        <span class="btn-icon">📘</span>
        <div><div>Facebook 粉專私訊</div><div class="btn-label">點此前往粉專</div></div>
      </a>`;
    }
    if (ci.phone && ci.phone.enabled && ci.phone.number) {
      contactHtml += `<a href="tel:${ci.phone.number}" class="contact-btn phone-btn">
        <span class="btn-icon">📞</span>
        <div><div>撥打電話</div><div class="btn-label">${ci.phone.number}</div></div>
      </a>`;
    }
    if (ci.note) {
      contactHtml += `<div style="font-size:12px;color:var(--text3);margin-top:8px;text-align:center">${ci.note}</div>`;
    }
    contactHtml += '</div>';
  }

  const body = document.getElementById('orderSuccessBody');
  body.innerHTML = `
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:40px;margin-bottom:8px">🌸</div>
      <div style="font-size:13px;color:var(--text2)">訂單已送出，感謝您的購買！</div>
      <div class="order-success-id">${order.id}</div>
      ${amountLine}
    </div>
    ${contactHtml}
    <button class="btn-full" style="margin-top:16px;background:var(--surface2);color:var(--text2);border:1.5px solid var(--border)" onclick="closeModal('orderSuccessModal')">關閉</button>`;

  openModal('orderSuccessModal');
}
// ═══════════════════════════════════════
function doOrderQuery() {
  const raw = document.getElementById('queryPhone').value.trim();
  if (!raw) {
    document.getElementById('orderQueryResult').innerHTML = '<p style="color:var(--accent-dark);font-size:13px">❌ 請輸入電話號碼或訂單編號</p>';
    return;
  }
  const res = document.getElementById('orderQueryResult');

  // 重新從 localStorage 讀取最新資料（確保拿到後台最新訂單）
  const freshDB = loadShopDB();
  const allOrders = freshDB.orders || [];

  // 除去符號空格
  const clean = raw.replace(/[-\s]/g, '');

  let matched = [];

  // 1. 先嘗試用訂單編號查（ORD 開頭）
  if (raw.toUpperCase().startsWith('ORD')) {
    matched = allOrders.filter(o => o.id && o.id.toUpperCase().includes(raw.toUpperCase()));
  }

  // 2. 電話號碼查
  if (matched.length === 0) {
    matched = allOrders.filter(o => {
      const phone = (o.userPhone || '').replace(/[-\s]/g, '');
      return phone && phone === clean;
    });
  }

  // 3. 如果還是沒找到，嘗試比對登入會員的電話（針對舊訂單沒有 userPhone 的情況）
  if (matched.length === 0) {
    matched = allOrders.filter(o => {
      if (o.userPhone) return false; // 有 userPhone 但前面沒比到就跳過
      const user = freshDB.users.find(u => u.id === o.userId);
      return user && (user.phone || '').replace(/[-\s]/g, '') === clean;
    });
  }

  if (matched.length === 0) {
    // 顯示診斷訊息
    const totalOrders = allOrders.length;
    res.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">
      查無符合的訂單記錄<br>
      <span style="font-size:11px">（系統共有 ${totalOrders} 筆訂單）</span>
    </div>
    <div style="background:var(--pink-light);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--text2);margin-top:8px">
      💡 <strong>查詢提示：</strong><br>
      · 輸入下單時填寫的電話號碼（含區碼，如：0912345678）<br>
      · 或輸入訂單編號（如：ORD-2024-001）<br>
      · 若為訪客下單，請確認使用相同電話號碼
    </div>`;
    return;
  }

  const statusMap = {
    pending:   '<span class="badge badge-warn">待確認</span>',
    confirmed: '<span class="badge badge-info">已確認</span>',
    packing:   '<span class="badge badge-info">備貨中</span>',
    shipping:  '<span class="badge badge-info">運送中</span>',
    delivered: '<span class="badge badge-ok">已到貨</span>',
    cancelled: '<span class="badge" style="background:#fef0f0;color:#c04040">已取消</span>'
  };
  const payMap = {
    paid:            '<span class="badge badge-ok">已付款</span>',
    unpaid:          '<span class="badge badge-warn" style="background:#fef0f0;color:#c04040">未付款</span>',
    pending_payment: '<span class="badge badge-warn">待付款</span>',
    pending_verify:  '<span class="badge badge-warn">匯款核對中</span>'
  };
  const logMap = {
    blackcat:'黑貓宅急便', hsinchu:'新竹物流',
    '711':'7-11超商', family:'全家超商',
    face:'面交', hilife:'萊爾富', ok:'OK超商'
  };

  const sorted = [...matched].sort((a, b) => b.createdAt.localeCompare(a.createdAt));

  res.innerHTML = `<div style="font-size:12px;color:var(--text3);margin-bottom:10px">共找到 ${sorted.length} 筆訂單</div>`
    + sorted.map(o => `
    <div style="border:1.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent-dark)">${o.id}</span>
        <span style="font-size:11px;color:var(--text3)">${o.createdAt}</span>
      </div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px">${o.items.map(i => i.name + '×' + i.qty).join('、')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${statusMap[o.status] || o.status}
          ${payMap[o.payStatus] || ''}
        </div>
        <div style="font-weight:700;font-size:15px;color:var(--accent-dark)">${fmt(o.finalTotal)}</div>
      </div>
      ${o.isPreorder ? `<div style="font-size:11px;color:var(--warning);margin-bottom:4px">📦 預購訂金：${fmt(o.deposit)}（餘款：${fmt(o.finalTotal - o.deposit)}）</div>` : ''}
      ${o.address ? `<div style="font-size:11px;color:var(--text3)">📍 ${o.address}</div>` : ''}
      ${o.logisticsNum ? `<div style="font-size:11px;color:var(--text3);margin-top:3px">🚚 ${logMap[o.logistics] || o.logistics} 單號：<span style="font-family:var(--mono)">${o.logisticsNum}</span></div>` : `<div style="font-size:11px;color:var(--text3);margin-top:3px">🚚 ${logMap[o.logistics] || o.logistics}</div>`}
      ${o.transferCode ? `<div style="font-size:11px;color:var(--text3);margin-top:3px">💳 匯款後五碼：<span style="font-family:var(--mono)">${o.transferCode}</span></div>` : ''}
    </div>`).join('');
}

// ═══════════════════════════════════════
// FORGOT PASSWORD
// ═══════════════════════════════════════
function doForgotPassword() {
  const email = document.getElementById('forgotEmail').value.trim();
  const phone = document.getElementById('forgotPhone').value.trim();
  const newPwd = document.getElementById('forgotNewPwd').value;
  const res = document.getElementById('forgotResult');
  if (!email || !phone) { res.innerHTML = '<p style="color:var(--accent-dark);font-size:13px">❌ 請填寫 Email 與電話</p>'; return; }
  if (!newPwd || newPwd.length < 6) { res.innerHTML = '<p style="color:var(--accent-dark);font-size:13px">❌ 新密碼至少需要6碼</p>'; return; }
  const user = shopDB.users.find(u =>
    u.email === email &&
    (u.phone || '').replace(/[-\s]/g, '') === phone.replace(/[-\s]/g, '')
  );
  if (!user) { res.innerHTML = '<p style="color:var(--accent-dark);font-size:13px">❌ 查無符合的帳號，請確認 Email 與電話是否正確</p>'; return; }
  // 建立申請記錄
  if (!shopDB.pwdResetRequests) shopDB.pwdResetRequests = [];
  shopDB.pwdResetRequests.push({
    id: Date.now(),
    userId: user.id,
    userName: user.name,
    email: user.email,
    phone: user.phone,
    newPwd: newPwd,
    status: 'pending',
    createdAt: new Date().toISOString().split('T')[0]
  });
  saveShopDB();
  res.innerHTML = '<div style="background:#eef7f2;border:1px solid #b8dfc9;border-radius:8px;padding:12px;font-size:13px;color:#2d8a5e">✅ 申請已送出！管理員確認後將重設您的密碼，請留意通知。</div>';
  document.getElementById('forgotEmail').value = '';
  document.getElementById('forgotPhone').value = '';
  document.getElementById('forgotNewPwd').value = '';
}

// ═══════════════════════════════════════
// WHOLESALE UPGRADE REQUEST
// ═══════════════════════════════════════
function openWsUpgradeModal() { closeModal('memberModal'); openModal('wsUpgradeModal'); }

function doWsUpgradeRequest() {
  if (!currentUser) return;
  if (!shopDB.wsUpgradeRequests) shopDB.wsUpgradeRequests = [];
  // 檢查是否已有待審核申請
  const existing = shopDB.wsUpgradeRequests.find(r => r.userId === currentUser.id && r.status === 'pending');
  if (existing) { showToast('⏳ 您已有待審核的批發升等申請'); closeModal('wsUpgradeModal'); return; }
  const reason = document.getElementById('wsReason').value.trim();
  shopDB.wsUpgradeRequests.push({
    id: Date.now(),
    userId: currentUser.id,
    userName: currentUser.name,
    email: currentUser.email,
    phone: currentUser.phone,
    reason,
    status: 'pending',
    createdAt: new Date().toISOString().split('T')[0]
  });
  saveShopDB();
  closeModal('wsUpgradeModal');
  showToast('✅ 批發升等申請已送出，等待管理員審核！', 4000);
}
// ═══════════════════════════════════════
// 右下角社群浮動按鈕
// ═══════════════════════════════════════
let socialFloatOpen = false;

function renderSocialFloat() {
  const ci = shopDB.contactInfo || {};
  const items = document.getElementById('socialItems');
  if (!items) return;

  const contacts = [];
  if (ci.line   && ci.line.enabled   && ci.line.id)
    contacts.push({ label:'LINE 私訊',    color:'line-color',  icon:'💚', href:'https://line.me/ti/p/~'+ci.line.id,  isPhone:false });
  if (ci.lineat && ci.lineat.enabled && ci.lineat.url)
    contacts.push({ label:'LINE@',         color:'line-color',  icon:'💚', href:ci.lineat.url,                          isPhone:false });
  if (ci.fb     && ci.fb.enabled     && ci.fb.url)
    contacts.push({ label:'FB 粉專',       color:'fb-color',    icon:'📘', href:ci.fb.url,                              isPhone:false });
  if (ci.phone  && ci.phone.enabled  && ci.phone.number)
    contacts.push({ label:ci.phone.number, color:'phone-color', icon:'📞', href:'tel:'+ci.phone.number,                isPhone:true  });

  const float = document.getElementById('socialFloat');
  if (contacts.length === 0) {
    if (float) float.style.display = 'none';
    return;
  }
  if (float) float.style.display = 'flex';

  items.innerHTML = contacts.map(function(c, i) {
    return '<div class="social-item" id="si_'+i+'" style="transition-delay:'+(i*0.05)+'s">'
      + '<span class="social-float-label">'+c.label+'</span>'
      + '<a href="'+c.href+'" target="'+(c.isPhone?'_self':'_blank')+'" rel="noopener"'
      + ' class="social-item-btn '+c.color+'" title="'+c.label+'">'+c.icon+'</a>'
      + '</div>';
  }).join('');
}

function toggleSocialFloat() {
  socialFloatOpen = !socialFloatOpen;
  const btn = document.getElementById('socialToggleBtn');
  if (btn) btn.classList.toggle('open', socialFloatOpen);
  document.querySelectorAll('.social-item').forEach(function(el, i) {
    setTimeout(function() { el.classList.toggle('visible', socialFloatOpen); }, i * 50);
  });
}

document.addEventListener('click', function(e) {
  const float = document.getElementById('socialFloat');
  if (socialFloatOpen && float && !float.contains(e.target)) {
    socialFloatOpen = false;
    const btn = document.getElementById('socialToggleBtn');
    if (btn) btn.classList.remove('open');
    document.querySelectorAll('.social-item').forEach(function(el) { el.classList.remove('visible'); });
  }
});


// Close modals on background click
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-bg.open').forEach(m => m.classList.remove('open'));
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
  }
});

// Scroll to top
window.addEventListener('scroll', () => { document.getElementById('toTop').classList.toggle('show', window.scrollY > 400); });
document.getElementById('toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

// ═══════════════════════════════════════
// 跨分頁同步：當其他分頁修改 localStorage 時自動刷新
// ═══════════════════════════════════════
window.addEventListener('storage', (e) => {
  if (e.key === 'sanrio_shop_db') {
    shopDB = loadShopDB();
    // 若目前登入的會員資料有變動（例如後台調整角色/狀態），同步更新 currentUser
    if (currentUser) {
      const updated = shopDB.users.find(u => u.id === currentUser.id);
      if (updated) {
        if (updated.status === 'disabled') {
          currentUser = null;
          showToast('⚠ 您的帳號已被停用，已自動登出');
        } else {
          currentUser = updated;
        }
      }
    }
    renderApp();
    renderSocialFloat();
    renderAnnounceBar();
    // 若購物車彈窗開啟中，重新渲染以更新庫存/價格
    if (document.getElementById('cartModal')?.classList.contains('open')) renderCartModal();
  } else if (e.key === 'sanrio_cart') {
    cart = loadCart();
    if (document.getElementById('cartModal')?.classList.contains('open')) renderCartModal();
    renderApp();
  }
});

init();
</script>
