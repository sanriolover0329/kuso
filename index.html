<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三麗鷗中毒日記</title>
<meta name="description" content="精選三麗鷗娃娃收藏，每天都被三麗鷗治癒中♡">
<meta name="theme-color" content="#e8608a">
<meta property="og:type" content="website">
<meta property="og:title" content="三麗鷗中毒日記">
<meta property="og:description" content="精選三麗鷗娃娃收藏，每天都被三麗鷗治癒中♡">
<meta property="og:image" content="LOGO.jpg">
<link rel="icon" type="image/jpeg" href="LOGO.jpg">
<link rel="apple-touch-icon" href="LOGO.jpg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono&display=swap');
:root{
  --bg:#fff5f7;--surface:#ffffff;--surface2:#fff0f3;--border:#f0d0da;
  --accent:#e8608a;--accent2:#f9b8cb;--accent-dark:#c0325c;
  --text:#3a2030;--text2:#8a607a;--text3:#c0a0b0;--radius:12px;
  --sans:'Noto Sans TC',sans-serif;--serif:'Playfair Display',serif;--mono:'DM Mono',monospace;
  --success:#3a8a5a;--warning:#b07020;--pink-light:#fce4ef;--header-h:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-y:scroll}
img{-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none;pointer-events:none}
button img,a img{pointer-events:auto}
.gallery,.card,.img-wrap{-webkit-user-select:none;user-select:none}
/* Announce */
.announce-bar{width:100%;padding:8px 20px;text-align:center;font-size:13px;font-weight:500;overflow:hidden}
.announce-bar.marquee-mode .announce-text{display:inline-block;white-space:nowrap;animation:marqueeScroll 20s linear infinite;padding-left:100%}
@keyframes marqueeScroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.announce-bar.static-mode .announce-text{display:block}
/* Fixed Header */
#fixed-header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);box-shadow:0 2px 12px rgba(232,96,138,.08)}
.hero{background:#fce8ef;border-bottom:2px solid #f9b8cb;width:100%;overflow:hidden}
.hero-logo-img{display:block;width:100%;height:auto;max-height:260px;object-fit:contain;object-position:center;background:#fce8ef}
@media(max-width:900px){.hero-logo-img{max-height:180px}}
@media(max-width:600px){.hero-logo-img{max-height:120px}}
@media(max-width:400px){.hero-logo-img{max-height:90px}}
.sticky-bar{background:rgba(255,245,247,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);overflow:visible}
.sticky-inner{max-width:1400px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-height:54px;overflow:visible}
.search-wrap{position:relative;flex:1;max-width:280px;min-width:100px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
#searchInput{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 32px;font-family:var(--sans);font-size:13px;color:var(--text);outline:none;transition:border-color .2s;pointer-events:all!important}
#searchInput:focus{border-color:var(--accent);background:#fff}
#searchInput::placeholder{color:var(--text3)}
/* Slogan */
.shop-slogan-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;max-width:100%;overflow:hidden}
@media(max-width:540px){.shop-slogan-wrap{display:none}}
#shopSlogan{width:100%;max-width:100%;overflow-x:hidden;overflow-y:visible;display:flex;justify-content:center}
.slogan-style-a{font-weight:700;font-style:italic;background:linear-gradient(90deg,#ff6b9d,#ff9a3c,#ffd93d,#6bcb77,#4d96ff,#c77dff);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:rainbow-flow 3s linear infinite;white-space:nowrap;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
@keyframes rainbow-flow{0%{background-position:0%}100%{background-position:300%}}
.slogan-style-b-wrap{width:100%;overflow:hidden;background:#1a0a0a;border-radius:5px;padding:5px 0}
.slogan-style-b-track{display:flex;white-space:nowrap;animation:marquee-scroll 14s linear infinite}
.slogan-style-b-text{font-family:'Courier New',monospace;font-weight:700;padding-right:60px;letter-spacing:.08em;flex-shrink:0}
@keyframes marquee-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.slogan-style-c{font-weight:600;font-style:italic;white-space:nowrap;display:inline-block;border-right:2.5px solid currentColor;animation:typing-cursor .7s step-end infinite;overflow:hidden;max-width:100%;text-overflow:clip}
@keyframes typing-cursor{0%,100%{border-color:currentColor}50%{border-color:transparent}}
.slogan-style-c-wrap{display:inline-block;overflow:hidden;white-space:nowrap}
.slogan-style-d,.slogan-style-f{display:inline-flex;align-items:center;white-space:nowrap;overflow:visible}
.slogan-style-d span{display:inline-block;font-weight:700;animation:char-bounce 1.2s ease-in-out infinite}
@keyframes char-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.slogan-style-e{font-weight:700;letter-spacing:.06em;animation:neon-pulse 2.5s ease-in-out infinite;white-space:nowrap;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.slogan-style-e .spin-icon{animation:icon-spin 3s linear infinite;display:inline-block}
@keyframes neon-pulse{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.85;filter:brightness(1.4)}}
@keyframes icon-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.slogan-style-f span{display:inline-block;font-weight:700;animation:wave-dance 2s ease-in-out infinite}
@keyframes wave-dance{0%,100%{transform:translateY(0);filter:hue-rotate(0deg)}25%{transform:translateY(-5px);filter:hue-rotate(90deg)}75%{transform:translateY(-5px);filter:hue-rotate(270deg)}}
/* Header Right */
.header-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0;pointer-events:all!important}
.hdr-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:var(--sans);transition:all .2s;white-space:nowrap;pointer-events:all!important}
.hdr-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface2)}
.hdr-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.hdr-btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.cart-badge{background:var(--accent);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 5px;min-width:18px;text-align:center}
@media(max-width:480px){.hdr-btn span{display:none}.hdr-btn{padding:6px 8px}}
/* Categories */
.cat-scroll{background:var(--surface);border-bottom:1px solid var(--border)}
.cat-inner{max-width:1400px;margin:0 auto;padding:0 16px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.cat-inner::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:11px 16px;font-family:var(--sans);font-size:13px;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:5px;pointer-events:all!important}
.cat-tab:hover{color:var(--accent)}
.cat-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cat-count-badge{display:inline-block;font-size:10px;font-family:var(--mono);background:var(--surface2);color:var(--text3);border-radius:10px;padding:0 6px;margin-left:3px;min-width:18px;text-align:center;line-height:16px}
.cat-tab.active .cat-count-badge{background:rgba(255,255,255,.25);color:var(--accent)}
/* Gallery */
#gallery-section{padding-top:var(--header-h,280px)}
.gallery-wrap{max-width:1400px;margin:0 auto;padding:16px 16px 120px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min,130px),1fr));gap:10px}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:visible;cursor:pointer;position:relative;transition:z-index 0s}
.card:hover{z-index:10}
.img-wrap{position:relative;overflow:hidden;aspect-ratio:1;background:var(--surface2);border-radius:9px 9px 0 0}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.34,1.2,.64,1)}
.card:hover .img-wrap img{transform:scale(1.15)}
.card:hover{box-shadow:0 12px 36px rgba(232,96,138,.22),0 0 0 2px var(--accent);border-color:var(--accent);transform:translateY(-4px) scale(1.06);transition:transform .3s cubic-bezier(.34,1.4,.64,1),box-shadow .3s,border-color .2s}
.skeleton{position:absolute;inset:0;background:linear-gradient(90deg,var(--surface2) 25%,#ffe0ea 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:9px 9px 0 0}
.img-loaded .skeleton{display:none}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
.overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(200,50,100,.55) 0%,transparent 60%);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;border-radius:9px 9px 0 0}
.card:hover .overlay{opacity:1}
.overlay-hint{background:rgba(255,255,255,.9);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--accent-dark);font-weight:500;pointer-events:none}
.card-info{padding:6px 8px 8px}
.card-id{font-family:var(--mono);font-size:9px;color:var(--text3)}
.card-name{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 3px;color:var(--text)}
.card-price-row{display:flex;align-items:center;justify-content:space-between;margin:3px 0}
.card-price{font-size:12px;font-weight:700;color:var(--accent-dark);font-family:var(--mono)}
.card-price-member{font-size:10px;color:var(--success)}
.ws-badge{display:inline-flex;align-items:center;background:#e8f0fe;color:#2850b0;border:1px solid #c0d4f8;border-radius:4px;font-size:9px;font-weight:600;padding:1px 5px}
.ws-tiers-mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.ws-tier-chip{background:#e8f0fe;color:#2850b0;border-radius:4px;font-size:9px;padding:1px 5px;font-family:var(--mono)}
.card-cat-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:1px 6px;border-radius:4px;font-weight:500}
.add-cart-btn{width:100%;margin-top:6px;padding:5px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:all .2s;display:none;pointer-events:all!important}
.card:hover .add-cart-btn{display:block}
.add-cart-btn:hover{background:var(--accent);color:#fff}
.stock-badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:4px}
.stock-low{background:#fff8e0;color:#8a6010}
.stock-out{background:#fef0f0;color:#c04040}
.preorder-badge{background:#e8f0fe;color:#2850b0;font-size:9px;padding:1px 5px;border-radius:3px}
.state-empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text3)}
.state-empty .icon{font-size:3rem;margin-bottom:12px}
.load-more-wrap{text-align:center;margin-top:32px}
#loadMoreBtn{display:inline-flex;align-items:center;gap:8px;padding:12px 36px;background:transparent;border:1.5px solid var(--accent);border-radius:8px;color:var(--accent);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
#loadMoreBtn:hover{background:var(--accent);color:#fff}
/* Lightbox */
#lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(20,16,14,.96);backdrop-filter:blur(10px);align-items:center;justify-content:center}
#lightbox.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lb-counter{position:fixed;top:18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.35);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:4px 14px}
.lb-wrap{position:relative;max-width:min(88vw,860px);display:flex;flex-direction:column;align-items:center;gap:14px}
#lbImg{max-width:100%;max-height:65vh;object-fit:contain;border-radius:12px;border:1px solid rgba(255,255,255,.08);animation:zoomIn .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes zoomIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.lb-info{text-align:center}
.lb-id{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.3);margin-bottom:4px}
.lb-name{font-family:var(--serif);font-size:1.3rem;color:#f5f0ea;margin-bottom:4px}
.lb-cat{font-size:12px;color:var(--accent2);letter-spacing:.06em}
.lb-price-row{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:6px;flex-wrap:wrap}
.lb-price{font-size:20px;font-weight:700;color:#f9b8cb;font-family:var(--mono)}
.lb-price-member{font-size:13px;color:#88d4a0}
.lb-ws-tiers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.lb-ws-chip{background:rgba(160,200,255,.15);border:1px solid rgba(160,200,255,.3);border-radius:8px;padding:5px 10px;text-align:center}
.lb-ws-chip-qty{font-size:10px;color:rgba(255,255,255,.4)}
.lb-ws-chip-price{font-size:14px;font-weight:700;color:#a0c8ff;font-family:var(--mono)}
.lb-add-cart{padding:10px 28px;background:var(--accent);color:#fff;border:none;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .2s;margin-top:4px;pointer-events:all!important}
.lb-add-cart:hover{background:var(--accent-dark);transform:scale(1.04)}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:20px;transition:all .18s;backdrop-filter:blur(4px)}
.lb-nav:hover{background:var(--accent);border-color:var(--accent)}
#lbPrev{left:20px}#lbNext{right:20px}
.lb-close{position:fixed;top:18px;right:20px;width:38px;height:38px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:20px;transition:background .15s}
.lb-close:hover{background:#c04040;border-color:#c04040}
/* Social Float */
.social-float{position:fixed;bottom:24px;right:20px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.social-float>*{pointer-events:all}
.social-toggle-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(232,96,138,.45);background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-size:22px;transition:transform .2s,box-shadow .2s}
.social-toggle-btn:hover{transform:scale(1.1)}
.social-toggle-btn.open{transform:rotate(45deg)}
.social-items{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.social-item{display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px) scale(.9);transition:opacity .2s,transform .2s;pointer-events:none}
.social-item.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:all}
.social-item-label{background:rgba(0,0,0,.7);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:14px;white-space:nowrap;backdrop-filter:blur(6px)}
.social-item-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.2);transition:transform .15s;flex-shrink:0}
.social-item-btn:hover{transform:scale(1.12)}
.social-float-label{font-size:10px;font-weight:700;background:#fff;border-radius:8px;padding:2px 8px;box-shadow:0 2px 8px rgba(0,0,0,.1);color:var(--accent-dark);white-space:nowrap;margin-right:4px}
#toTop{position:fixed;bottom:24px;left:20px;right:auto;width:40px;height:40px;background:var(--accent);border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:center;justify-content:center;z-index:50}
#toTop.show{opacity:1;pointer-events:all}
/* Modals */
.modal-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(58,32,48,.5);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex;animation:fadeIn .2s ease}
.modal-box{background:#fff;border-radius:20px;width:100%;box-shadow:0 24px 60px rgba(180,80,130,.2);max-height:92vh;overflow-y:auto}
.modal-head{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-family:var(--serif);font-size:20px;color:var(--text)}
.modal-close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text3);line-height:1}
.modal-body{padding:20px 24px 28px}
#authModal .modal-box{max-width:420px}
.auth-tabs{display:flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:22px}
.auth-tab{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;background:transparent;color:var(--text2);font-family:var(--sans);transition:all .2s}
.auth-tab.active{background:var(--accent);color:#fff}
.f-group{margin-bottom:14px}
.f-group label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.f-group input,.f-group select,.f-group textarea{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:var(--surface2);outline:none;font-family:var(--sans);transition:border .2s}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{border-color:var(--accent);background:#fff}
.btn-full{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);background:var(--accent);color:#fff;transition:background .2s}
.btn-full:hover{background:var(--accent-dark)}
.auth-hint{font-size:12px;color:var(--text3);text-align:center;margin-top:12px;background:var(--surface2);padding:10px;border-radius:8px}
/* Cart */
#cartModal .modal-box{max-width:680px}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.cart-img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface2);flex-shrink:0}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-id{font-family:var(--mono);font-size:10px;color:var(--text3)}
.cart-qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-size:14px;color:var(--accent-dark);display:flex;align-items:center;justify-content:center;transition:all .2s}
.qty-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.cart-item-price{font-weight:700;font-size:14px;color:var(--accent-dark);font-family:var(--mono);min-width:70px;text-align:right}
.remove-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px}
.remove-btn:hover{color:#c04040}
.cart-summary{background:var(--surface2);border-radius:12px;padding:16px;margin-top:16px}
.summary-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--text2)}
.summary-row.total{border-top:1.5px solid var(--border);margin-top:8px;padding-top:10px;font-weight:700;font-size:16px;color:var(--accent-dark)}
.checkout-section{margin-top:20px}
.section-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title::before{content:'';display:inline-block;width:4px;height:14px;background:var(--accent);border-radius:2px}
.log-cat-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.log-cat-btn{flex:1;min-width:80px;padding:10px 8px;border:2px solid var(--border);border-radius:10px;background:var(--surface2);cursor:pointer;text-align:center;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text2);transition:all .2s}
.log-cat-btn:hover{border-color:var(--accent2)}

// Slogan System A-F
const CC=['#ff6b9d','#ff9a3c','#ffd93d','#6bcb77','#4d96ff','#c77dff'];
function initSlogans(cfg){_sloganList=(cfg.slogans&&cfg.slogans.length>0)?cfg.slogans:['錢錢沒有不見，只是變成妳愛的樣子 ♡'];_sloganStyle=cfg.sloganStyle||'C';_sloganColor=cfg.sloganColor||'#c0325c';_sloganSize=cfg.sloganFontSize||14;_sloganSpeed=cfg.sloganSpeed||1;_sloganIdx=Math.floor(Math.random()*_sloganList.length);rotateSlogans();}
function buildSloganEl(text){const el=document.getElementById('shopSlogan');if(!el)return;el.innerHTML='';const s=_sloganStyle,c=_sloganColor,sz=_sloganSize;
  if(s==='A'){const sp=document.createElement('span');sp.className='slogan-style-a';sp.style.fontSize=sz+'px';sp.textContent=text;el.appendChild(sp);}
  else if(s==='B'){
    const dur=(14/_sloganSpeed).toFixed(1)+'s';
    const w=document.createElement('div');w.className='slogan-style-b-wrap';w.style.width='100%';
    const tr=document.createElement('div');tr.className='slogan-style-b-track';
    tr.style.animationDuration=dur;
    for(let i=0;i<2;i++){const sp=document.createElement('span');sp.className='slogan-style-b-text';sp.style.color=c;sp.style.textShadow=`0 0 6px ${c},0 0 14px ${c}`;sp.style.fontSize=sz+'px';sp.textContent='🧸 '+text+'   ';tr.appendChild(sp);}
    w.appendChild(tr);el.appendChild(w);
  }
  else if(s==='C'){
    const w=document.createElement('span');w.className='slogan-style-c-wrap';
    const sp=document.createElement('span');sp.className='slogan-style-c';sp.style.color=c;sp.style.fontSize=sz+'px';
    w.appendChild(sp);el.appendChild(w);
    // JS typing effect: type out characters, then pause, then erase
    let idx=0,erasing=false,timer=null;
    function typeStep(){
      if(!erasing){
        sp.textContent=text.slice(0,idx);
        idx++;
        if(idx>text.length){clearTimeout(timer);timer=setTimeout(()=>{erasing=true;typeStep();},Math.round(2000/_sloganSpeed));return;}
        timer=setTimeout(typeStep,Math.round(60/_sloganSpeed));
      }else{
        sp.textContent=text.slice(0,idx);
        idx--;
        if(idx<0){clearTimeout(timer);erasing=false;idx=0;timer=setTimeout(typeStep,Math.round(600/_sloganSpeed));return;}
        timer=setTimeout(typeStep,Math.round(30/_sloganSpeed));
      }
    }
    // Clean up previous timer if element is replaced
    if(el._typingTimer){clearTimeout(el._typingTimer);}
    el._typingTimer=setTimeout(()=>typeStep(),300);
  }
  else if(s==='D'){const w=document.createElement('div');w.className='slogan-style-d';[...text].forEach((ch,i)=>{const sp=document.createElement('span');sp.textContent=ch===' '?' ':ch;sp.style.color=CC[i%CC.length];sp.style.animationDelay=(i*.07)+'s';sp.style.fontSize=sz+'px';w.appendChild(sp);});el.appendChild(w);}
  else if(s==='E'){const sp=document.createElement('span');sp.className='slogan-style-e';sp.style.color=c;sp.style.textShadow=`0 0 10px ${c}88`;sp.style.fontSize=sz+'px';sp.innerHTML='<span class="spin-icon">🌸</span> '+text+' <span class="spin-icon">🌸</span>';el.appendChild(sp);}
  else if(s==='F'){const w=document.createElement('div');w.className='slogan-style-f';[...text].forEach((ch,i)=>{const sp=document.createElement('span');sp.textContent=ch===' '?' ':ch;sp.style.color=CC[i%CC.length];sp.style.animationDelay=(i*.1)+'s';sp.style.fontSize=sz+'px';w.appendChild(sp);});el.appendChild(w);}
}
function rotateSlogans(){clearInterval(_sloganTimer);if(!_sloganList.length)return;const show=()=>{const el=document.getElementById('shopSlogan');if(!el)return;if(_sloganStyle==='B'){buildSloganEl(_sloganList[_sloganIdx%_sloganList.length]);_sloganIdx=(_sloganIdx+1)%_sloganList.length;return;}el.style.opacity='0';el.style.transition='opacity 0.5s';setTimeout(()=>{buildSloganEl(_sloganList[_sloganIdx%_sloganList.length]);el.style.opacity='1';_sloganIdx=(_sloganIdx+1)%_sloganList.length;},500);};show();if(_sloganList.length>1)_sloganTimer=setInterval(show,4500);}

(function(){let tx=0,ty=0;const lb=document.getElementById('lightbox');lb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});lb.addEventListener('touchend',e=>{if(!lb.classList.contains('open'))return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){lbIndex=dx<0?(lbIndex+1)%filtered.length:(lbIndex-1+filtered.length)%filtered.length;updateLightbox();}},{passive:true});})();

function addToCart(pid){const p=config.products.find(x=>x.id===pid);if(!p)return;const pp=shopDB.productPrices[pid];if(!pp||!pp.retail){showToast('此商品尚未設定價格');return;}if(pp.stock===0&&!pp.preorder){showToast('此商品目前缺貨');return;}const ex=cart.find(c=>c.id===pid);const nq=(ex?ex.qty:0)+1;const ml=pp.maxQty||shopDB.settings?.globalMaxQty||0;if(ml>0&&nq>ml){showToast(`⚠ 此商品單次最多購買 ${ml} 件`);return;}if(ex)ex.qty++;else cart.push({id:pid,name:p.name||pid,url:buildUrl(p),qty:1,retail:pp.retail,preorder:pp.stock===0&&pp.preorder});saveCart();showToast('✅ 已加入購物車：'+(p.name||pid));const tq=cart.reduce((a,c)=>a+c.qty,0);const badge=document.querySelector('.cart-badge');if(badge)badge.textContent=tq;else{const cb=document.querySelector('.hdr-btn.primary');if(cb){const b=document.createElement('span');b.className='cart-badge';b.textContent=tq;cb.appendChild(b);}}}

  const da=isMemberRole()?Math.round(sub*disc/100):0,cda=calcCouponDiscount(sub-da),ft=sub-da-cda,hp=cart.some(c=>c.preorder),dep=hp?Math.round(ft*.5):0;

function cartQty(id,delta){const item=cart.find(c=>c.id===id);if(!item)return;if(delta>0){const pp=shopDB.productPrices[id]||{};const ml=pp.maxQty||shopDB.settings?.globalMaxQty||0;if(ml>0&&item.qty+delta>ml){showToast(`⚠ 此商品單次最多購買 ${ml} 件`);return;}}item.qty+=delta;if(item.qty<=0)removeFromCart(id);else{saveCart();renderCartModal();}}
function removeFromCart(id){cart=cart.filter(c=>c.id!==id);saveCart();renderCartModal();}
function applyCoupon(){const code=(document.getElementById('couponInput')?.value||'').trim().toUpperCase();const res=document.getElementById('couponResult');if(!code){if(res)res.innerHTML='';appliedCoupon=null;return;}const coupon=(shopDB.coupons||[]).find(c=>c.code===code&&c.active);if(!coupon){if(res)res.innerHTML='<span style="color:var(--accent-dark)">❌ 折扣碼無效或已停用</span>';return;}if(coupon.expiry&&new Date(coupon.expiry)<new Date()){if(res)res.innerHTML='<span style="color:var(--accent-dark)">❌ 此折扣碼已過期</span>';return;}if(coupon.maxUse>0&&(coupon.usedCount||0)>=coupon.maxUse){if(res)res.innerHTML='<span style="color:var(--accent-dark)">❌ 已達使用上限</span>';return;}let sub=0;cart.forEach(item=>{sub+=getEffectivePrice(item.id,item.qty)*item.qty;});if(coupon.minSpend>0&&sub<coupon.minSpend){if(res)res.innerHTML=`<span style="color:var(--accent-dark)">❌ 需消費滿 ${fmt(coupon.minSpend)} 才能使用</span>`;return;}appliedCoupon=coupon;const dl=coupon.type==='percent'?coupon.value+'% 折扣':'折抵 '+fmt(coupon.value);if(res)res.innerHTML=`<span style="color:var(--success)">✅ 折扣碼已套用：${dl}</span>`;renderCartModal();setTimeout(()=>{const i=document.getElementById('couponInput');if(i)i.value=code;const r=document.getElementById('couponResult');if(r)r.innerHTML=`<span style="color:var(--success)">✅ 折扣碼已套用：${dl}</span>`;},50);}

const PAYMENT_MAP={delivery:['cod','prepay'],cvs:['cod','prepay'],face:['face_pay','transfer_face']};
function selectLogCat(type){document.querySelectorAll('.log-cat-btn').forEach(b=>b.classList.remove('active'));const cb=document.querySelector(`.log-cat-btn[onclick*="'${type}'"]`);if(cb)cb.classList.add('active');document.querySelectorAll('.log-sub-panel').forEach(p=>p.classList.remove('open'));const panel=document.getElementById('log-sub-'+type);if(panel)panel.classList.add('open');const fr=panel&&panel.querySelector('input[type=radio]');if(fr){fr.checked=true;panel.querySelectorAll('.log-sub-item').forEach(el=>el.classList.remove('selected'));fr.closest('.log-sub-item').classList.add('selected');onLogisticsChange(type,fr.value);}}

function onLogisticsChange(type,logId){document.querySelectorAll('input[name=logistics]').forEach(r=>{r.checked=r.value===logId;});const hp=cart.some(c=>c.preorder);let ap=PAYMENT_MAP[type]||['cod','prepay'];if(hp){ap=ap.filter(id=>id!=='cod'&&id!=='face_pay');if(!ap.length)ap=['prepay'];}const pays=shopDB.payments.filter(p=>p.active&&ap.includes(p.id));const payEl=document.getElementById('paymentSection');if(!payEl)return;const pn=hp?'<div style="background:#fff0d8;border:1px solid #f0d090;border-radius:7px;padding:8px 12px;font-size:11px;color:#7a5010;margin-bottom:8px">⚠ 預購商品不支援貨到付款，請先行付款</div>':'';payEl.innerHTML='<div class="section-title">付款方式</div>'+pn+'<div style="display:flex;flex-direction:column;gap:8px">'+pays.map((p,i)=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s" onclick="onPaymentChange('${p.id}')"><input type="radio" name="payment" value="${p.id}" ${i===0?'checked':''}><span style="font-size:13px;color:var(--text);flex:1">${p.name}</span></label>`).join('')+'</div><div id="transferCodeWrap" style="display:none;margin-top:10px"><div class="f-group"><label>匯款後五碼 *</label><input type="text" id="transferCode" maxlength="5" placeholder="匯款帳號後五碼" style="letter-spacing:4px;font-family:var(--mono);font-size:16px;width:160px"></div><div style="font-size:11px;color:var(--text3);margin-top:4px">請先完成匯款再填入後五碼供核對</div></div>';if(pays.length>0)onPaymentChange(pays[0].id);renderShippingInfo(type,logId);}

function submitOrder(){
  for(const item of cart){const err=checkQtyLimits(item.id,item.qty);if(err){showToast('❌ '+item.name+'：'+err);return;}}
  const sn=document.getElementById('shipName')?.value.trim(),sp=document.getElementById('shipPhone')?.value.trim();
  const logEl=document.querySelector('input[name=logistics]:checked'),payEl=document.querySelector('input[name=payment]:checked');
  if(!sn){showToast('❌ 請填寫姓名');return;}if(!sp){showToast('❌ 請填寫電話');return;}if(!logEl){showToast('❌ 請選擇配送方式');return;}if(!payEl){showToast('❌ 請選擇付款方式');return;}
  const logId=logEl.value,logObj=shopDB.logistics.find(l=>l.id===logId)||{},logType=logObj.type||'delivery';
  let shipAddr='';
  if(logType==='delivery'){shipAddr=document.getElementById('shipAddr')?.value.trim()||'';if(!shipAddr){showToast('❌ 請填寫收件地址');return;}}
  else if(logType==='cvs'){const se=document.getElementById('cvsStoreName');shipAddr=se?.value.trim()||'';if(!shipAddr){showToast('❌ 請填寫或選擇超商門市');return;}shipAddr='【'+logObj.name+'】'+shipAddr;}
  else{shipAddr=document.getElementById('shipAddr')?.value.trim()||'（面交）';}
  const nc=payEl.value==='prepay'||payEl.value==='transfer_face',tc=document.getElementById('transferCode')?.value.trim()||'';
  if(nc&&!tc){showToast('❌ 請填寫匯款後五碼');return;}if(nc&&tc.length!==5){showToast('❌ 匯款後五碼需為5碼');return;}
  const disc=isMemberRole()?getTierDiscount(currentUser):0;let sub=0;
  const items=cart.map(c=>{const eff=getEffectivePrice(c.id,c.qty);sub+=eff*c.qty;return{id:c.id,name:c.name,qty:c.qty,price:eff,preorder:c.preorder};});
  const da=isMemberRole()?Math.round(sub*disc/100):0,cda=calcCouponDiscount(sub-da),fin=sub-da-cda,hp=cart.some(c=>c.preorder);
  const order={id:genOrderId(),userId:currentUser?currentUser.id:0,userName:sn,userPhone:sp,items,subtotal:sub,discount:da,couponCode:appliedCoupon?appliedCoupon.code:'',couponDiscount:cda,finalTotal:fin,status:'pending',logistics:logId,logisticsName:logObj.name||logId,logisticsType:logType,logisticsNum:'',payment:payEl.value,payStatus:payEl.value==='cod'||payEl.value==='face_pay'?'unpaid':(nc?'pending_verify':'pending_payment'),transferCode:nc?tc:'',note:'',createdAt:new Date().toISOString().split('T')[0],isPreorder:hp,deposit:hp?Math.round(fin*.5):0,address:shipAddr};
  shopDB.orders.push(order);
  items.forEach(it=>{const pp=shopDB.productPrices[it.id];if(pp&&!it.preorder&&typeof pp.stock==='number')pp.stock=Math.max(0,pp.stock-it.qty);});
  if(currentUser){const u=shopDB.users.find(x=>x.id===currentUser.id);if(u&&(order.payStatus==='pending_verify'||order.payStatus==='paid'))u.totalSpent+=fin;}
  if(appliedCoupon){const c=(shopDB.coupons||[]).find(c=>c.code===appliedCoupon.code);if(c)c.usedCount=(c.usedCount||0)+1;}
  saveShopDB();cart=[];saveCart();appliedCoupon=null;

  // ── 寫入 Firebase Firestore（跨裝置即時同步到後台）──
  fbWriteOrder(order);

  // ── 共用佇列（同裝置備用）──
  try{
    const SHARED_KEY='sanrio_pending_orders';
    const pending=JSON.parse(localStorage.getItem(SHARED_KEY)||'[]');
    pending.push({...order,_fromFrontend:true,_receivedAt:new Date().toISOString()});
    if(pending.length>200)pending.splice(0,pending.length-200);
    localStorage.setItem(SHARED_KEY,JSON.stringify(pending));
  }catch(e){}

  closeModal('cartModal');renderApp();showOrderSuccess(order);
}

  const encodedMsg=encodeURIComponent(orderMsg);

function copyOrderMsg(){
  const txt=document.getElementById('orderMsgBox')?.textContent||'';
  navigator.clipboard.writeText(txt).then(()=>showToast('✅ 訂單資訊已複製！')).catch(()=>{

  });
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function switchAuthTab(tab,btn){document.querySelectorAll('.auth-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('loginForm').style.display=tab==='login'?'block':'none';document.getElementById('registerForm').style.display=tab==='register'?'block':'none';}
async function doLogin(){
  const input=document.getElementById('loginEmail').value.trim();
  const pwd=document.getElementById('loginPwd').value;
  if(!input||!pwd){showToast('❌ 請填寫帳號與密碼');return;}

  // 先嘗試 Firebase Auth（雲端會員）
  if(_fbReady){
    const email=input.includes('@')?input:(shopDB.users.find(u=>(u.phone||'').replace(/[-\s]/g,'')===input.replace(/[-\s]/g,''))?.email||null);
    if(email){
      try{
        const cred=await fbSignIn(email,pwd);
        if(cred){
          // 從 Firestore 讀取會員資料
          let user=shopDB.users.find(u=>u.email===email);
          if(!user){
            try{
              const doc=await db.collection('members').doc(cred.user.uid).get();
              if(doc.exists){
                user={...doc.data(),id:doc.id};
                shopDB.users.push(user);
                saveShopDB();
              }
            }catch(e){}
          }
          if(user){
            if(user.status==='pending'){showToast('⏳ 帳號尚未審核');return;}
            if(user.status==='disabled'){showToast('❌ 帳號已停用');return;}
            currentUser=user;closeModal('authModal');
            showToast('✅ 歡迎回來，'+user.name+'！');renderApp();return;
          }
        }
      }catch(e){showToast('❌ '+e.message);return;}
    }
  }

  // 備用：本地 localStorage 帳號（管理者demo帳號）
  const ci=input.replace(/[-\s]/g,'');
  const user=shopDB.users.find(u=>(u.email===input||(u.phone||'').replace(/[-\s]/g,'')===ci)&&u.pwd===pwd);
  if(!user){showToast('❌ 帳號或密碼錯誤');return;}
  if(user.status==='pending'){showToast('⏳ 帳號尚未審核');return;}
  if(user.status==='disabled'){showToast('❌ 帳號已停用');return;}
  currentUser=user;closeModal('authModal');showToast('✅ 歡迎回來，'+user.name+'！');renderApp();
}
async function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const phone=document.getElementById('regPhone').value.trim();
  const invite=document.getElementById('regInvite').value.trim();
  const pwd=document.getElementById('regPwd').value;
  if(!name||!email||!phone||!pwd){showToast('❌ 請填寫必填欄位');return;}
  if(pwd.length<6){showToast('❌ 密碼至少需要6碼');return;}

  const userData={name,email,phone,invite,role:'member',status:'active',
    tier:'bronze',totalSpent:0,createdAt:new Date().toISOString().split('T')[0]};

  if(_fbReady){
    try{
      const cred=await fbSignUp(email,pwd,userData);
      if(cred){
        const user={...userData,id:cred.user.uid,uid:cred.user.uid};
        shopDB.users.push(user);saveShopDB();
        showToast('✅ 申請成功！帳號已啟用，請登入 ♡',4000);
        switchAuthTab('login',document.querySelector('.auth-tab'));
        return;
      }
    }catch(e){showToast('❌ '+e.message);return;}
  }

  // 備用：本地儲存
  if(shopDB.users.find(u=>u.email===email)){showToast('❌ 此 Email 已被使用');return;}
  shopDB.users.push({id:shopDB.users.length+1,...userData,pwd,status:'pending'});
  saveShopDB();showToast('✅ 申請已送出！等待管理員審核♡',4000);
}

  ak.forEach(k=>{
    const c=contacts[k],m=SM[k]||{label:k,icon:'📱',hint:''};
    allBtns.push({key:k,label:c.title||m.label,bg:SC[k]||'#888',icon:SI[k]||'📱',onclick:`openContactModalPlatform('${k}')`});
  });
  if(hasAI)allBtns.push({key:'ai',label:_aiCfg.name||'AI 小幫手',bg:SC.ai,icon:SI.ai,onclick:`openAiModal()`});

  const toggleBtn=document.getElementById('socialToggleBtn');

  if(totalCount<=3){
    // ≤3 個：直接全部顯示，不需要展開按鈕
    if(toggleBtn)toggleBtn.style.display='none';
    items.innerHTML=allBtns.map((b,i)=>`<div class="social-item visible" style="transition-delay:0s">
      <span class="social-float-label">${b.label}</span>
      <button class="social-item-btn" style="background:${b.bg}" onclick="${b.onclick}">${b.icon}</button>
    </div>`).join('');
  }else{
    // >3 個：用 + 展開
    if(toggleBtn)toggleBtn.style.display='flex';
    items.innerHTML=allBtns.map((b,i)=>`<div class="social-item" id="si_${i}" style="transition-delay:${i*.05}s">
      <span class="social-float-label">${b.label}</span>
      <button class="social-item-btn" style="background:${b.bg}" onclick="${b.onclick}">${b.icon}</button>
    </div>`).join('');
  }
}
function openContactModalPlatform(platform){
  const contacts=window._mc||_contacts||{};
  const c=contacts[platform];if(!c)return;
  const m=SM[platform]||{label:platform,icon:'📱',hint:''};
  const body=document.getElementById('contactModalBody');
  let qr='';if(platform==='line'&&c.qrImage)qr=`<img class="modal-qr-img" src="${c.qrImage}" alt="QR" style="color:${SC[platform]};border-color:${SC[platform]}">`;
  body.innerHTML=`<div class="modal-qr-icon">${m.icon}</div><div class="modal-qr-title" style="color:${SC[platform]}">${c.title||m.label}</div><div class="modal-qr-sub">${c.desc||''}</div>${qr}<button class="modal-cta-btn" style="background:${SC[platform]}" id="cfCtaBtn">${SI[platform]||'📱'} ${m.label}</button><div class="modal-hint">${c.hint||m.hint}</div>`;
  document.getElementById('cfCtaBtn').onclick=()=>{let url='';if(platform==='line')url=c.url||'';if(platform==='fb')url=c.url||'';if(platform==='ig')url=`https://ig.me/m/${c.username||''}`;if(platform==='wa')url=c.url||(c.phone?`https://wa.me/${c.phone.replace(/\D/g,'')}`:'');if(platform==='email')url=`mailto:${c.email||''}`;if(url)window.open(url,'_blank','noopener');};
  openModal('contactModal');if(socialFloatOpen)toggleSocialFloat();
}

function toggleSocialFloat(){socialFloatOpen=!socialFloatOpen;const btn=document.getElementById('socialToggleBtn');if(btn)btn.classList.toggle('open',socialFloatOpen);document.querySelectorAll('.social-item').forEach((el,i)=>{setTimeout(()=>el.classList.toggle('visible',socialFloatOpen),socialFloatOpen?i*50:0);});}
// 已移除點外部自動關閉浮動視窗的行為

// AI
function openAiModal(){aiQA=_aiCfg.qa||[];const ne=document.getElementById('aiName'),ae=document.getElementById('aiAvatar');if(ne)ne.textContent=_aiCfg.name||'小幫手';if(ae)ae.textContent=_aiCfg.avatar||'🤖';const msgs=document.getElementById('aiMsgs');msgs.innerHTML='';addAiBubble('bot',`嗨！我是 ${_aiCfg.name||'小幫手'} ${_aiCfg.avatar||'🤖'}<br>有任何問題都可以問我喔！`);const qb=document.getElementById('aiQuickBtns');qb.innerHTML='';aiQA.slice(0,5).forEach(q=>{const btn=document.createElement('button');btn.className='ai-quick-btn';btn.textContent=q.q;btn.addEventListener('click',()=>handleAiQuick(q.q));qb.appendChild(btn);});document.getElementById('aiInput').value='';openModal('aiModal');if(socialFloatOpen)toggleSocialFloat();}
function addAiBubble(type,html){const msgs=document.getElementById('aiMsgs');const div=document.createElement('div');div.className='ai-bubble '+type;div.innerHTML=html;msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;return div;}
function handleAiQuick(q){document.getElementById('aiInput').value=q;sendAiMsg();}
function sendAiMsg(){const input=document.getElementById('aiInput');const q=input.value.trim();if(!q)return;input.value='';addAiBubble('user',q);const lower=q.toLowerCase();const match=aiQA.find(item=>lower.includes(item.q.toLowerCase())||(item.keywords||[]).some(kw=>lower.includes(kw.toLowerCase())));const td=addAiBubble('bot typing','···');setTimeout(()=>{td.classList.remove('typing');td.innerHTML=match?match.a:'這個問題我還不確定，建議直接聯絡我們喔！<br><small style="color:#aaa">（點右下角其他聯絡按鈕）</small>';document.getElementById('aiMsgs').scrollTop=9999;},800);}

// Scroll + Events
window.addEventListener('scroll',()=>{document.getElementById('toTop').classList.toggle('show',window.scrollY>400);});
document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
document.querySelectorAll('.modal-bg').forEach(bg=>{bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('open');});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal-bg.open').forEach(m=>m.classList.remove('open'));if(document.getElementById('lightbox').classList.contains('open'))closeLightbox();}});
window.addEventListener('storage',e=>{if(e.key==='sanrio_shop_db'){shopDB=loadShopDB();if(currentUser){const upd=shopDB.users.find(u=>u.id===currentUser.id);if(upd){if(upd.status==='disabled'){currentUser=null;showToast('⚠ 您的帳號已被停用');}else currentUser=upd;}}renderApp();renderAnnounceBar();if(document.getElementById('cartModal')?.classList.contains('open'))renderCartModal();}else if(e.key==='sanrio_cart'){cart=loadCart();if(document.getElementById('cartModal')?.classList.contains('open'))renderCartModal();renderApp();}});

// 圖片保護
(function(){document.addEventListener('contextmenu',e=>{const t=e.target.tagName.toLowerCase();if(t==='input'||t==='textarea')return;e.preventDefault();return false;});document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG'){e.preventDefault();return false;}});document.addEventListener('touchstart',e=>{if(e.target.tagName==='IMG')e.preventDefault();},{passive:false});document.addEventListener('keydown',e=>{if(e.key==='F12'){e.preventDefault();return false;}if(e.ctrlKey&&e.key==='u'){e.preventDefault();return false;}if(e.ctrlKey&&e.shiftKey&&['i','I','j','J','c','C'].includes(e.key)){e.preventDefault();return false;}if(e.ctrlKey&&e.key==='s'){e.preventDefault();return false;}});setInterval(()=>{console.clear();},5000);})();

init();
</script>

<script>
const LEGAL_LABELS={
  productDesc:'商品說明',pricingModel:'收費模式說明',shippingPolicy:'出貨天期與運費',
  refundPolicy:'退換貨政策',consumerRights:'消費者權益',termsOfService:'服務條款',privacyPolicy:'隱私權政策'
};
const DEFAULT_LEGAL={
  productDesc:'本店販售正版授權三麗鷗系列娃娃（Hello Kitty、美樂蒂、布丁狗、Cinnamoroll 等），商品尺寸約 20-40 公分，聚酯纖維材質，適合收藏或贈禮。',

  refundPolicy:'商品到貨後 7 天內如有瑕疵或與描述不符，請拍照聯繫客服申請退換貨，退回商品需保持原包裝完整。因個人因素退貨需自行負擔運費。',
  consumerRights:'依消費者保護法第 19 條，網路購物享有 7 天鑑賞期（非試用期）。如有消費爭議，可向各縣市消費者服務中心或消費者保護委員會申訴。',
  termsOfService:'使用本網站即表示您同意本服務條款。本店保留修改商品價格、庫存及服務內容的權利。如有任何問題請透過聯絡方式與我們聯繫。',
  privacyPolicy:'本店蒐集您的個人資料（姓名、電話、收件地址）僅用於訂單處理與商品寄送，不會提供予第三方。您有權要求查詢、更正或刪除個人資料。'
};
function openLegalModal(key){
  const cfg=(typeof shopDB!=='undefined'&&shopDB.legalPages)?shopDB.legalPages:{};
  const text=cfg[key]||DEFAULT_LEGAL[key]||'（尚未設定，請聯絡客服）';
  document.getElementById('legalModalTitle').textContent=LEGAL_LABELS[key]||key;
  document.getElementById('legalModalBody').textContent=text;
  openModal('legalModal');
}
function scrollToContact(){
  const si=shopDB.storeInfo||{};
  const hasInfo=si.phone||si.address||si.line||si.hours;
  if(hasInfo){
    let body='';
    if(si.phone)body+=`📞 客服電話：${si.phone}\n`;
    if(si.line)body+=`💚 LINE：${si.line}\n`;
    if(si.hours)body+=`🕐 營業時間：${si.hours}\n`;
    if(si.address)body+=`📍 地址：${si.address}\n`;
    document.getElementById('legalModalTitle').textContent='聯絡我們';
    document.getElementById('legalModalBody').textContent=body.trim();
    openModal('legalModal');
    return;
  }
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  if(!socialFloatOpen)toggleSocialFloat();
}
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
// ══ Firebase 初始化 ══
let db=null, fbAuth=null, _fbReady=false;
(function initFirebase(){
  try{
    firebase.initializeApp({
  apiKey: "AIzaSyA3kgOzXmctLLIqkQUfIQMsfRHo0z3Q8zY",
  authDomain: "shop-a1f71.firebaseapp.com",
  projectId: "shop-a1f71",
  storageBucket: "shop-a1f71.firebasestorage.app",
  messagingSenderId: "553604129740",
  appId: "1:553604129740:web:7e0ee771e1030235feb369"});
    db=firebase.firestore();
    fbAuth=firebase.auth();
    _fbReady=true;
    // 監聽 Auth 狀態：讓會員登入狀態在重整後恢復
    fbAuth.onAuthStateChanged(user=>{
      if(user){
        const u=shopDB.users.find(x=>x.email===user.email);
        if(u&&!currentUser){currentUser=u;renderApp();}
      }
    });
  }catch(e){console.warn('Firebase init failed:',e);}
})();

// ── Firebase 讀取商品價格（覆蓋本地預設值）──
async function loadFbProductPrices(){
  if(!_fbReady)return;
  try{
    const snap=await db.collection('products').get();
    let changed=false;
    snap.forEach(doc=>{
      if(!shopDB.productPrices[doc.id]){shopDB.productPrices[doc.id]={...doc.data()};changed=true;}
      else{shopDB.productPrices[doc.id]={...doc.data(),...shopDB.productPrices[doc.id]};changed=true;}
    });
    // 重新渲染已顯示的商品，確保價格出現
    if(changed){const g=document.getElementById('gallery');if(g)g.innerHTML='';currentPage=0;renderGalleryPage();}
  }catch(e){}
}

// ── Firebase 寫入訂單 ──
async function fbWriteOrder(order){
  if(!_fbReady)return;
  try{
    await db.collection('orders').doc(order.id).set({
      ...order,
      _source:'frontend',
      _serverTime:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){console.warn('Order write failed:',e);}
}

// ── Firebase 會員登入 ──
async function fbSignIn(email,pwd){
  if(!_fbReady)return null;
  try{return await fbAuth.signInWithEmailAndPassword(email,pwd);}
  catch(e){return null;}
}

// ── Firebase 會員註冊 ──
async function fbSignUp(email,pwd,userData){
  if(!_fbReady)return null;
  try{
    const cred=await fbAuth.createUserWithEmailAndPassword(email,pwd);
    // 把會員資料寫進 Firestore
    await db.collection('members').doc(cred.user.uid).set({
      ...userData,
      uid:cred.user.uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    return cred;
  }catch(e){
    if(e.code==='auth/email-already-in-use')throw new Error('此 Email 已被使用');
    if(e.code==='auth/weak-password')throw new Error('密碼強度不足（至少6位）');
    throw e;
  }
}

// ── Firebase 會員登出 ──
function fbSignOut(){if(_fbReady&&fbAuth)fbAuth.signOut().catch(()=>{});}

// 最新消息系統
// ════════════════════════════════════
function openNewsDrawer(){
  document.getElementById('newsDrawer').classList.add('open');
  document.getElementById('newsOverlay').classList.add('open');
  document.body.style.overflow='hidden';
  localStorage.setItem('sanrio_last_news_read',Date.now().toString());
  renderNewsDrawer();
  // 清除未讀角標
  document.querySelectorAll('.cat-news-badge').forEach(b=>b.remove());
}
function closeNewsDrawer(){
  document.getElementById('newsDrawer').classList.remove('open');
  document.getElementById('newsOverlay').classList.remove('open');
  document.body.style.overflow='';
}
function toggleNewsPost(el){
  el.classList.toggle('open');
}
function getUnreadNewsCount(){
  const posts=shopDB.newsPosts||[];
  if(!posts.length)return 0;
  const lastRead=parseInt(localStorage.getItem('sanrio_last_news_read')||'0');
  return posts.filter(p=>(p.createdAt||0)>lastRead).length;
}
function renderNewsDrawer(){
  const posts=shopDB.newsPosts||[];
  const el=document.getElementById('newsDrawerContent');
  if(!el)return;
  if(!posts.length){
    el.innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text3)"><div style="font-size:2rem;margin-bottom:8px">📭</div>暫無消息</div>';
    return;
  }
  const lastRead=parseInt(localStorage.getItem('sanrio_last_news_read')||'0');
  el.innerHTML=posts.map(function(p,i){
    const isNew=(p.createdAt||0)>lastRead;
    return'<div class="news-post-item'+(i===0?' open':'')+'" onclick="toggleNewsPost(this)">'
      +'<div class="news-post-head">'
      +(isNew?'<span class="news-tag-new">NEW</span>':'')
      +'<span class="news-date">'+p.date+'</span>'
      +'<span class="news-post-title">'+p.title+'</span>'
      +'<span class="news-arrow">▶</span></div>'
      +'<div class="news-post-body"><div class="news-post-body-inner">'+(p.content||'').replace(/\n/g,'<br>')+'</div></div>'
      +'</div>';
  }).join('');
}
function renderNewsBanner(){
  const posts=shopDB.newsPosts||[];
  const banner=document.getElementById('newsBanner');
  if(!banner)return;
  if(!posts.length){banner.classList.remove('open');banner.innerHTML='';return;}
  const latest=posts[0];
  const dismissed=sessionStorage.getItem('sanrio_banner_dismissed');
  if(dismissed)return;
  banner.innerHTML='<div class="news-banner-inner">'
    +'<span class="news-banner-badge">📢 最新</span>'
    +'<span class="news-banner-date">'+latest.date+'</span>'
    +'<span class="news-banner-title" onclick="openNewsDrawer()">'+latest.title+'</span>'
    +'<button class="news-banner-close" onclick="closeNewsBanner()" title="關閉">×</button>'
    +'</div>';
  setTimeout(function(){banner.classList.add('open');},300);
}
function closeNewsBanner(){
  document.getElementById('newsBanner').classList.remove('open');
  sessionStorage.setItem('sanrio_banner_dismissed','1');
}

</script>
