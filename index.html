<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三麗鷗中毒日記</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono&display=swap');

:root {
  --bg: #fff5f7;
  --surface: #ffffff;
  --surface2: #fff0f3;
  --border: #f0d0da;
  --accent: #e8608a;
  --accent2: #f9b8cb;
  --accent-dark: #c0325c;
  --text: #3a2030;
  --text2: #8a607a;
  --text3: #c0a0b0;
  --radius: 12px;
  --sans: 'Noto Sans TC', sans-serif;
  --serif: 'Playfair Display', serif;
  --mono: 'DM Mono', monospace;
  --success: #3a8a5a;
  --warning: #b07020;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Hero ── */
.hero { background: #fce8ef; position: relative; overflow: hidden; border-bottom: 2px solid #f9b8cb; }
.hero-logo-img { width: 100%; height: auto; max-height: 280px; display: block; object-fit: cover; object-position: center center; }
@media (max-width: 768px) { .hero-logo-img { max-height: 180px; } }
@media (max-width: 480px) { .hero-logo-img { max-height: 110px; } }

/* ── Sticky Header ── */
.sticky-bar { position: sticky; top: 0; z-index: 100; background: rgba(255,245,247,0.96); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
.sticky-inner { max-width: 1400px; margin: 0 auto; padding: 8px 20px; min-height: 54px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.shop-slogan { font-size: 12px; color: var(--accent); font-style: italic; white-space: nowrap; flex-shrink: 0; letter-spacing: 0.02em; display: none; }
@media (min-width: 700px) { .shop-slogan { display: block; } }
.search-wrap { flex: 1; max-width: 340px; position: relative; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
#searchInput { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px 8px 34px; font-family: var(--sans); font-size: 13px; color: var(--text); outline: none; transition: border-color 0.2s; }
#searchInput:focus { border-color: var(--accent); background: #fff; }
#searchInput::placeholder { color: var(--text3); }
.count-info { font-family: var(--mono); font-size: 12px; color: var(--text2); white-space: nowrap; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; flex-shrink: 0; }

/* ── Header right buttons ── */
.header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.hdr-btn { display: flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text2); font-family: var(--sans); transition: all .2s; white-space: nowrap; }
.hdr-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface2); }
.hdr-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.hdr-btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.cart-badge { background: var(--accent); color: #fff; border-radius: 10px; font-size: 10px; font-weight: 700; padding: 1px 6px; min-width: 18px; text-align: center; }

/* ── Category Tabs ── */
.cat-scroll { background: var(--surface); border-bottom: 1px solid var(--border); }
.cat-inner { max-width: 1200px; margin: 0 auto; padding: 0 28px; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
.cat-inner::-webkit-scrollbar { display: none; }
.cat-tab { flex-shrink: 0; padding: 14px 18px; font-family: var(--sans); font-size: 13px; color: var(--text2); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.cat-tab:hover { color: var(--accent); }
.cat-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Gallery ── */
.gallery-wrap { max-width: 1400px; margin: 0 auto; padding: 16px 20px 120px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min,130px), 1fr)); gap: 10px; }

/* ── Product Card ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: visible; cursor: pointer; position: relative; transition: z-index 0s; }
.card:hover { z-index: 10; }
.img-wrap { position: relative; overflow: hidden; aspect-ratio: 1; background: var(--surface2); border-radius: 9px 9px 0 0; }
.img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s cubic-bezier(0.34,1.2,0.64,1); }
.card:hover .img-wrap img { transform: scale(1.15); }
.card:hover { box-shadow: 0 12px 36px rgba(232,96,138,0.22), 0 0 0 2px var(--accent); border-color: var(--accent); transform: translateY(-4px) scale(1.06); transition: transform 0.3s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.3s, border-color 0.2s; }
.skeleton { position: absolute; inset: 0; background: linear-gradient(90deg, var(--surface2) 25%, #ffe0ea 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 9px 9px 0 0; }
.img-loaded .skeleton { display: none; }
@keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }
.overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(200,50,100,0.55) 0%, transparent 60%); opacity: 0; transition: opacity 0.2s; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; border-radius: 9px 9px 0 0; }
.card:hover .overlay { opacity: 1; }
.overlay-hint { background: rgba(255,255,255,0.9); border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--accent-dark); font-weight: 500; pointer-events: none; }

/* ── Card Info with price ── */
.card-info { padding: 6px 8px 8px; }
.card-id { font-family: var(--mono); font-size: 9px; color: var(--text3); }
.card-name { font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 1px 0 3px; color: var(--text); }
.card-price-row { display: flex; align-items: center; justify-content: space-between; margin: 3px 0; }
.card-price { font-size: 12px; font-weight: 700; color: var(--accent-dark); font-family: var(--mono); }
.card-price-member { font-size: 10px; color: var(--success); }
.card-price-ws { font-size: 10px; color: #2850b0; font-family: var(--mono); }
.ws-badge { display: inline-flex; align-items: center; gap: 3px; background: #e8f0fe; color: #2850b0; border: 1px solid #c0d4f8; border-radius: 4px; font-size: 9px; font-weight: 600; padding: 1px 5px; }
.ws-tiers-mini { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.ws-tier-chip { background: #e8f0fe; color: #2850b0; border-radius: 4px; font-size: 9px; padding: 1px 5px; font-family: var(--mono); }
.card-cat-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
.add-cart-btn { width: 100%; margin-top: 6px; padding: 5px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: var(--sans); transition: all .2s; display: none; }
.card:hover .add-cart-btn { display: block; }
.add-cart-btn:hover { background: var(--accent); color: #fff; }
.stock-badge { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }
.stock-ok { background: #eef7f0; color: #2d7a4a; }
.stock-low { background: #fff8e0; color: #8a6010; }
.stock-out { background: #fef0f0; color: #c04040; }
.preorder-badge { background: #e8f0fe; color: #2850b0; font-size: 9px; padding: 1px 5px; border-radius: 3px; }

/* ── Empty / Error ── */
.state-empty { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--text3); }
.state-empty .icon { font-size: 3rem; margin-bottom: 12px; }
.state-empty p { font-size: 14px; margin-bottom: 6px; }
.state-empty small { font-size: 12px; }

/* ── Load More ── */
.load-more-wrap { text-align: center; margin-top: 32px; }
#loadMoreBtn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 36px; background: transparent; border: 1.5px solid var(--accent); border-radius: 8px; color: var(--accent); font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
#loadMoreBtn:hover { background: var(--accent); color: #fff; }

/* ── Lightbox ── */
#lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(20,16,14,0.96); backdrop-filter: blur(10px); align-items: center; justify-content: center; }
#lightbox.open { display: flex; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.lb-wrap { position: relative; max-width: min(88vw, 860px); display: flex; flex-direction: column; align-items: center; gap: 14px; }
#lbImg { max-width: 100%; max-height: 65vh; object-fit: contain; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); animation: zoomIn 0.28s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes zoomIn { from{transform:scale(0.88);opacity:0} to{transform:scale(1);opacity:1} }
.lb-info { text-align: center; }
.lb-id { font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
.lb-name { font-family: var(--serif); font-size: 1.3rem; color: #f5f0ea; margin-bottom: 4px; }
.lb-cat { font-size: 12px; color: var(--accent2); letter-spacing: 0.06em; }
.lb-price-row { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.lb-price { font-size: 20px; font-weight: 700; color: #f9b8cb; font-family: var(--mono); }
.lb-price-member { font-size: 13px; color: #88d4a0; }
.lb-price-ws { font-size: 13px; color: #a0c8ff; }
.lb-ws-tiers { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.lb-ws-chip { background: rgba(160,200,255,0.15); border: 1px solid rgba(160,200,255,0.3); border-radius: 8px; padding: 5px 10px; text-align: center; }
.lb-ws-chip-qty { font-size: 10px; color: rgba(255,255,255,0.4); }
.lb-ws-chip-price { font-size: 14px; font-weight: 700; color: #a0c8ff; font-family: var(--mono); }
.lb-add-cart { padding: 10px 28px; background: var(--accent); color: #fff; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); transition: all .2s; margin-top: 4px; }
.lb-add-cart:hover { background: var(--accent-dark); transform: scale(1.04); }
.lb-counter { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 4px 14px; }
.lb-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 20px; transition: all 0.18s; backdrop-filter: blur(4px); }
.lb-nav:hover { background: var(--accent); border-color: var(--accent); }
#lbPrev { left: 20px; }
#lbNext { right: 20px; }
.lb-close { position: fixed; top: 18px; right: 20px; width: 38px; height: 38px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 20px; transition: background 0.15s; }
.lb-close:hover { background: #c04040; border-color: #c04040; }

/* ── Scroll to top ── */
body { overflow-y: auto; }
#toTop { position: fixed; bottom: 100px; right: 20px; width: 40px; height: 40px; background: var(--accent); border: none; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.25s; display: flex; align-items: center; justify-content: center; z-index: 50; }
#toTop.show { opacity: 1; pointer-events: all; }

/* ── LINE Float ── */
.line-float { position: fixed; bottom: 24px; left: 20px; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.line-float-btn { width: 52px; height: 52px; background: #06C755; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(6,199,85,0.45); transition: transform 0.2s, box-shadow 0.2s; border: none; cursor: pointer; }
.line-float-btn:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(6,199,85,0.55); }
.line-float-btn svg { width: 28px; height: 28px; fill: #fff; }
.line-float-label { font-size: 10px; color: #06C755; font-weight: 700; background: #fff; border-radius: 8px; padding: 2px 7px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); white-space: nowrap; letter-spacing: 0.04em; }
.line-modal-bg { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); align-items: center; justify-content: center; }
.line-modal-bg.open { display: flex; animation: fadeIn 0.2s ease; }
.line-modal { background: #fff; border-radius: 20px; padding: 28px 24px; text-align: center; width: 300px; max-width: 90vw; box-shadow: 0 24px 60px rgba(0,0,0,0.25); position: relative; }
.line-modal-icon { font-size: 2rem; margin-bottom: 4px; }
.line-modal-title { font-size: 16px; font-weight: 700; color: #06C755; margin-bottom: 2px; }
.line-modal-sub { font-size: 12px; color: #888; margin-bottom: 16px; }
.line-modal-qr { width: 180px; height: 180px; object-fit: contain; border-radius: 12px; border: 3px solid #06C755; margin-bottom: 14px; }
.line-modal-cta { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 12px; background: #06C755; color: #fff; border-radius: 10px; font-size: 14px; font-weight: 700; text-decoration: none; transition: background 0.15s; cursor: pointer; border: none; font-family: var(--sans); }
.line-modal-cta:hover { background: #05a648; }
.line-modal-close { position: absolute; top: 12px; right: 14px; background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer; }
.line-modal-hint { font-size: 11px; color: #aaa; margin-top: 10px; }

/* ── MODAL OVERLAY BASE ── */
.modal-bg { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(58,32,48,0.5); backdrop-filter: blur(6px); align-items: center; justify-content: center; padding: 16px; }
.modal-bg.open { display: flex; animation: fadeIn .2s ease; }
.modal-box { background: #fff; border-radius: 20px; width: 100%; box-shadow: 0 24px 60px rgba(180,80,130,.2); max-height: 92vh; overflow-y: auto; }
.modal-head { padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between; }
.modal-head h2 { font-family: var(--serif); font-size: 20px; color: var(--text); }
.modal-close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text3); line-height: 1; }
.modal-body { padding: 20px 24px 28px; }

/* ── AUTH MODAL ── */
#authModal .modal-box { max-width: 420px; }
.auth-tabs { display: flex; background: var(--surface2); border-radius: 10px; padding: 3px; margin-bottom: 22px; }
.auth-tab { flex: 1; padding: 8px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; background: transparent; color: var(--text2); font-family: var(--sans); transition: all .2s; }
.auth-tab.active { background: var(--accent); color: #fff; }
.f-group { margin-bottom: 14px; }
.f-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; }
.f-group input, .f-group select { width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: var(--surface2); outline: none; font-family: var(--sans); transition: border .2s; }
.f-group input:focus, .f-group select:focus { border-color: var(--accent); background: #fff; }
.f-note { font-size: 11px; color: var(--text3); margin-top: 4px; }
.btn-full { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); background: var(--accent); color: #fff; transition: background .2s; }
.btn-full:hover { background: var(--accent-dark); }
.auth-hint { font-size: 12px; color: var(--text3); text-align: center; margin-top: 12px; background: var(--surface2); padding: 10px; border-radius: 8px; }

/* ── CART MODAL ── */
#cartModal .modal-box { max-width: 680px; }
.cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.cart-img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-item-id { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.cart-qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface2); cursor: pointer; font-size: 14px; color: var(--accent-dark); display: flex; align-items: center; justify-content: center; transition: all .2s; }
.qty-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.cart-item-price { font-weight: 700; font-size: 14px; color: var(--accent-dark); font-family: var(--mono); min-width: 70px; text-align: right; }
.remove-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; padding: 4px; }
.remove-btn:hover { color: #c04040; }
.cart-summary { background: var(--surface2); border-radius: 12px; padding: 16px; margin-top: 16px; }
.summary-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; color: var(--text2); }
.summary-row.total { border-top: 1.5px solid var(--border); margin-top: 8px; padding-top: 10px; font-weight: 700; font-size: 16px; color: var(--accent-dark); }
.summary-row .label { color: var(--text2); }

/* ── CHECKOUT SECTION ── */
.checkout-section { margin-top: 20px; }
.section-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.section-title::before { content: ''; display: inline-block; width: 4px; height: 14px; background: var(--accent); border-radius: 2px; }
.radio-group { display: flex; flex-direction: column; gap: 8px; }
.radio-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; transition: all .2s; }
.radio-item:hover { border-color: var(--accent2); background: var(--surface2); }
.radio-item input[type=radio] { accent-color: var(--accent); }
.radio-label { font-size: 13px; color: var(--text); flex: 1; }
.radio-sub { font-size: 11px; color: var(--text3); }
.preorder-notice { background: #fff8e0; border: 1px solid #f0df90; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #7a6010; margin-top: 10px; line-height: 1.6; }

/* ── MEMBER PANEL ── */
#memberModal .modal-box { max-width: 540px; }
.tier-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.tier-chip { flex: 1; text-align: center; padding: 12px 8px; border-radius: 10px; border: 2px solid transparent; }
.tier-chip.bronze { background: linear-gradient(135deg,#fdf1e8,#f5dcc0); border-color: #cd7f32; }
.tier-chip.silver { background: linear-gradient(135deg,#f5f5f5,#dcdcdc); border-color: #9a9a9a; }
.tier-chip.gold { background: linear-gradient(135deg,#fffacd,#fde68a); border-color: #d4a017; }
.tier-chip.active-tier { box-shadow: 0 0 0 3px rgba(232,96,138,0.3); }
.tier-emoji { font-size: 20px; }
.tier-name { font-size: 12px; font-weight: 700; margin: 2px 0; }
.tier-pct { font-size: 20px; font-weight: 800; }
.tier-req { font-size: 10px; color: var(--text2); }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.info-cell { background: var(--surface2); border-radius: 8px; padding: 12px; }
.info-cell-label { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
.info-cell-val { font-size: 15px; font-weight: 700; color: var(--text); }
.prog-wrap { background: var(--surface2); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
.prog-bar-outer { height: 8px; background: var(--border); border-radius: 10px; overflow: hidden; margin: 8px 0; }
.prog-bar-inner { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .6s ease; }
.gift-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface2); border-radius: 8px; font-size: 13px; margin-bottom: 6px; }
.gift-check { color: #3a8a5a; font-size: 14px; }

/* ── ORDER HISTORY ── */
.order-row { padding: 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color .2s; }
.order-row:hover { border-color: var(--accent2); }
.order-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.order-id { font-family: var(--mono); font-size: 12px; color: var(--accent-dark); font-weight: 600; }
.order-date { font-size: 11px; color: var(--text3); }
.order-items { font-size: 12px; color: var(--text2); }
.order-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.order-total { font-weight: 700; font-size: 14px; color: var(--accent-dark); font-family: var(--mono); }
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 8px; }
.badge-ok { background: #eef7f2; color: #2d8a5e; }
.badge-warn { background: #fff8e0; color: #8a6010; }
.badge-info { background: #e8f0fe; color: #2850b0; }
.badge-pink { background: var(--surface2); color: var(--accent-dark); }

/* ── TOAST ── */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent-dark); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; z-index: 999; display: none; box-shadow: 0 4px 20px rgba(180,80,130,.3); max-width: 300px; }

/* ── Admin link ── */
.admin-link { position: fixed; bottom: 20px; right: 20px; background: var(--text); color: rgba(255,255,255,0.6); font-size: 11px; font-family: var(--mono); padding: 7px 12px; border-radius: 7px; text-decoration: none; transition: color 0.15s; z-index: 50; }
.admin-link:hover { color: #fff; }

@media (max-width: 600px) {
  .sticky-inner, .cat-inner, .gallery-wrap { padding-left: 12px; padding-right: 12px; }
  .gallery { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  #lbPrev { left: 8px; } #lbNext { right: 8px; }
  .tier-bar { flex-direction: column; }
  .info-grid { grid-template-columns: 1fr; }
  .header-right .hdr-btn span { display: none; }
}
</style>

<script>
// ═══════════════════════════════════════
// Cloudinary & Shop Config
// ═══════════════════════════════════════
const CLOUD_NAME = 'dkwviksvr';
const SHOP_TAG   = 'shop';
const CONFIG_URL = 'config.json';
const LINE_URL   = 'https://line.me/R/ti/g/6NrgspyX5H';

const EMBEDDED_CONFIG = null; // admin-replace-marker

let PAGE_SIZE  = 50;
let CARD_MIN   = 130;
let config     = { categories: [], products: [] };
let filtered   = [];
let currentPage = 0;
let lbIndex    = 0;
let activeCategory = 'all';

// ═══════════════════════════════════════
// MEMBER / SHOP DATA (localStorage)
// ═══════════════════════════════════════
function loadShopDB() {
  try {
    const s = localStorage.getItem('sanrio_shop_db');
    if (s) {
      const db = JSON.parse(s);
      // 資料遷移：補上 logistics type 欄位（舊版資料沒有）
      const typeMap = {
        blackcat:'delivery', hsinchu:'delivery',
        '711':'cvs', family:'cvs', hilife:'cvs', ok:'cvs',
        face:'face'
      };
      if (db.logistics) {
        db.logistics.forEach(l => {
          if (!l.type) l.type = typeMap[l.id] || 'delivery';
        });
        // 補上新竹物流（若舊資料沒有）
        if (!db.logistics.find(l => l.id === 'hsinchu')) {
          const bcIdx = db.logistics.findIndex(l => l.id === 'blackcat');
          db.logistics.splice(bcIdx + 1, 0, { id:'hsinchu', name:'新竹物流', type:'delivery', active:true, fee:100 });
        }
      }
      // 資料遷移：補上新版付款方式
      if (db.payments) {
        const payIds = db.payments.map(p => p.id);
        if (!payIds.includes('face_pay'))
          db.payments.push({ id:'face_pay', name:'面交取貨付款', active:true });
        // 移除已廢棄的 face 付款方式（改用 face_pay）
        db.payments = db.payments.filter(p => p.id !== 'face');
      }
      // 補上 cvs_stores（若舊資料沒有）
      if (!db.cvs_stores) db.cvs_stores = { '711':[], family:[], hilife:[], ok:[] };
      return db;
    }
  } catch(e) {}
  return {
    users: [
      { id:1, name:'管理員', email:'admin@test.com', pwd:'admin888', phone:'0900000001', role:'admin', status:'active', tier:'gold', totalSpent:99999, createdAt:'2024-01-01', invite:'' },
      { id:2, name:'金級示範', email:'member@test.com', pwd:'123456', phone:'0912345678', role:'member', status:'active', tier:'gold', totalSpent:15000, createdAt:'2024-02-01', invite:'' },
      { id:3, name:'批發示範', email:'wholesale@test.com', pwd:'123456', phone:'0922333444', role:'wholesale', status:'active', tier:'bronze', totalSpent:0, createdAt:'2024-02-01', invite:'' },
    ],
    orders: [],
    productPrices: {},
    tierSettings: [
      { tier:'bronze', label:'銅級', minSpend:0, discount:0 },
      { tier:'silver', label:'銀級', minSpend:3000, discount:5 },
      { tier:'gold',   label:'金級', minSpend:10000, discount:10 },
    ],
    gifts: [
      { name:'三麗鷗貼紙', minSpend:3000, active:true },
      { name:'限定購物袋', minSpend:8000, active:true },
      { name:'VIP禮盒',   minSpend:15000, active:true },
    ],
    logistics: [
      { id:'blackcat', name:'黑貓宅急便',    type:'delivery', active:true,  fee:100 },
      { id:'hsinchu',  name:'新竹物流',       type:'delivery', active:true,  fee:100 },
      { id:'711',      name:'7-11 超商取貨',  type:'cvs',      active:true,  fee:60  },
      { id:'family',   name:'全家超商取貨',   type:'cvs',      active:true,  fee:60  },
      { id:'hilife',   name:'萊爾富超商取貨', type:'cvs',      active:false, fee:60  },
      { id:'ok',       name:'OK超商取貨',     type:'cvs',      active:false, fee:60  },
      { id:'face',     name:'面交',           type:'face',     active:true,  fee:0   },
    ],
    payments: [
      { id:'cod',          name:'貨到付款',     active:true },
      { id:'prepay',       name:'先付款後出貨', active:true },
      { id:'transfer_face',name:'先轉帳後面交', active:true },
      { id:'face_pay',     name:'面交取貨付款', active:true },
    ],
    cvs_stores: { '711':[], family:[], hilife:[], ok:[] }
  };
}
function saveShopDB() {
  localStorage.setItem('sanrio_shop_db', JSON.stringify(shopDB));
}
let shopDB = loadShopDB();
let currentUser = null;
let cart = []; // [{id, name, url, qty, price, retail, preorder}]

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function fmt(n) { return 'NT$' + Math.round(Number(n)).toLocaleString(); }

function getTierInfo(user) {
  if (!user || user.role !== 'member') return shopDB.tierSettings[0];
  let info = shopDB.tierSettings[0];
  shopDB.tierSettings.forEach(t => { if (user.totalSpent >= t.minSpend) info = t; });
  return info;
}
function getTierDiscount(user) { return getTierInfo(user)?.discount || 0; }

function getWsPrice(pid, qty) {
  const pp = shopDB.productPrices[pid];
  if (!pp || !pp.wsTiers || pp.wsTiers.length === 0) return pp?.retail || 0;
  let price = pp.retail;
  [...pp.wsTiers].sort((a,b)=>a.qty-b.qty).forEach(t => { if (qty >= t.qty) price = t.price; });
  return price;
}

function isWholesale() { return currentUser && currentUser.role === 'wholesale'; }
function isMemberRole() { return currentUser && currentUser.role === 'member'; }

function getEffectivePrice(pid, qty) {
  const pp = shopDB.productPrices[pid];
  if (!pp) return 0;
  const retail = pp.retail || 0;
  // 批發會員：套用批發階梯價
  if (isWholesale()) return getWsPrice(pid, qty);
  // 一般會員：套用等級折扣
  if (isMemberRole()) {
    const disc = getTierDiscount(currentUser);
    const memberPrice = Math.round(retail * (1 - disc/100));
    return memberPrice;
  }
  // 訪客：零售價
  return retail;
}

function showToast(msg, dur) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, dur || 2500);
}

function genOrderId() {
  const d = new Date();
  return 'ORD-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '-' + String(shopDB.orders.length+1).padStart(3,'0');
}

// ═══════════════════════════════════════
// CLOUDINARY
// ═══════════════════════════════════════
async function fetchFromCloudinary() {
  const url = `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${encodeURIComponent(SHOP_TAG)}.json`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Cloudinary 回應 ${resp.status}`);
  const data = await resp.json();
  return data.resources || [];
}
async function fetchConfig() {
  if (EMBEDDED_CONFIG) return EMBEDDED_CONFIG;
  try {
    const resp = await fetch(CONFIG_URL + '?t=' + Date.now());
    if (resp.ok) {
      const cfg = await resp.json();
      if ((!cfg.categories || cfg.categories.length === 0)) {
        const local = localStorage.getItem('doll_shop_frontend');
        if (local) {
          const lc = JSON.parse(local);
          if (lc.categories && lc.categories.length > 0) {
            cfg.categories = lc.categories;
            cfg.productCategories = (lc.products||[]).filter(p=>p.category).map(p=>({id:p.id,category:p.category}));
          }
        }
      }
      return cfg;
    }
  } catch(e) {}
  try {
    const local = localStorage.getItem('doll_shop_frontend');
    if (local) {
      const lc = JSON.parse(local);
      return { categories: lc.categories||[], displayPageSize: lc.displayPageSize||50, displayCardSize: lc.displayCardSize||130, productCategories: (lc.products||[]).filter(p=>p.category).map(p=>({id:p.id,category:p.category})), productNames: {} };
    }
  } catch(e) {}
  return { categories: [], displayPageSize: 50, displayCardSize: 130 };
}
function extractId(publicId) {
  const filename = publicId.includes('/') ? publicId.split('/').pop() : publicId;
  let decoded = filename;
  try { decoded = decodeURIComponent(filename); } catch(e) {}
  const m = decoded.match(/^([A-Za-z]+\d+)/);
  return m ? m[1].toUpperCase() : null;
}
function buildUrl(product) {
  if (!product.url) return '';
  const sz = CARD_MIN > 150 ? 600 : 400;
  return product.url.replace('/image/upload/', `/image/upload/w_${sz},h_${sz},c_fill,q_auto,f_auto/`);
}
function buildFullUrl(product) {
  if (!product.url) return '';
  return product.url.replace('/image/upload/', '/image/upload/w_1400,h_1400,c_fill,q_auto,f_auto/');
}

// ═══════════════════════════════════════
// APP INIT
// ═══════════════════════════════════════
async function init() {
  showLoading();
  try {
    const [resources, cfg] = await Promise.all([fetchFromCloudinary(), fetchConfig()]);
    PAGE_SIZE = cfg.displayPageSize || 50;
    CARD_MIN  = cfg.displayCardSize || 130;
    document.documentElement.style.setProperty('--card-min', CARD_MIN + 'px');
    const catAssign = {};
    (cfg.productCategories || []).forEach(pc => { catAssign[pc.id] = pc.category; });
    const productMap = {};
    resources.forEach(r => {
      const id = extractId(r.public_id);
      if (!id) return;
      if (!productMap[id] || r.created_at > productMap[id].created_at) {
        productMap[id] = { id, name: cfg.productNames?.[id] || id, url: r.secure_url || `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/v${r.version}/${r.public_id}.${r.format}`, format: r.format || 'jpg', category: catAssign[id] || '', visible: true };
      }
    });
    config.products = Object.values(productMap).sort((a, b) => {
      const am = a.id.match(/^([A-Z]+)(\d+)$/), bm = b.id.match(/^([A-Z]+)(\d+)$/);
      if (!am || !bm) return a.id.localeCompare(b.id);
      if (am[1] !== bm[1]) return am[1].localeCompare(bm[1]);
      return parseInt(am[2]) - parseInt(bm[2]);
    });
    config.categories = cfg.categories || [];
    renderApp();
  } catch(err) {
    showError(err.message);
  }
}

function showLoading() {
  const styleClose = '</' + 'style>';
  document.getElementById('app').innerHTML = `<div style="text-align:center;padding:80px 20px;"><div style="font-size:3rem;margin-bottom:16px;animation:spin 1.5s linear infinite;display:inline-block;">🧸</div><div style="font-size:15px;color:var(--text2);">商品載入中，請稍候…</div></div><style>@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}${styleClose}`;
}
function showError(msg) {
  document.getElementById('app').innerHTML = `<div style="max-width:500px;margin:60px auto;text-align:center;padding:40px 24px;background:var(--surface);border:1px solid var(--border);border-radius:16px;"><div style="font-size:3rem;margin-bottom:12px;">😢</div><div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px;">圖片載入失敗</div><div style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:20px;">${msg}</div><button onclick="init()" style="padding:10px 28px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">重試</button></div>`;
}

// ═══════════════════════════════════════
// GALLERY
// ═══════════════════════════════════════
function applyFilters() {
  const q = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
  filtered = config.products.filter(p => {
    const matchCat = activeCategory === 'all' || p.category === activeCategory;
    const matchQ   = !q || p.id.toLowerCase().includes(q) || (p.name||'').toLowerCase().includes(q);
    return matchCat && matchQ && p.visible !== false;
  });
  currentPage = 0;
  document.getElementById('gallery').innerHTML = '';
  renderGalleryPage();
}

function renderGalleryPage() {
  const gallery = document.getElementById('gallery');
  const start = currentPage * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);
  const cats  = config.categories;
  const disc  = currentUser ? getTierDiscount(currentUser) : 0;

  if (filtered.length === 0) {
    gallery.innerHTML = `<div class="state-empty"><div class="icon">🔍</div><p>找不到符合條件的商品</p><small>試試其他關鍵字或分類</small></div>`;
    document.getElementById('loadMoreBtn').style.display = 'none';
    const ci = document.getElementById('countInfo');
    if (ci) ci.textContent = '找不到商品';
    return;
  }

  slice.forEach((p, i) => {
    const cat    = cats.find(c => c.id === p.category);
    const imgUrl = buildUrl(p);
    const pp     = shopDB.productPrices[p.id];
    const card   = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = start + i;

    let priceHtml = '';
    let stockHtml = '';
    let cartBtnHtml = '';
    if (pp && pp.retail) {
      const isOut = pp.stock === 0 && !pp.preorder;
      // 批發會員：顯示零售價 + 批發階梯
      if (isWholesale()) {
        const sortedTiers = (pp.wsTiers||[]).filter(t=>t.qty>0&&t.price>0).sort((a,b)=>a.qty-b.qty);
        const tiersHtml = sortedTiers.map(t=>`<span class="ws-tier-chip">≥${t.qty}件 ${fmt(t.price)}</span>`).join('');
        priceHtml = `<div class="card-price-row">
          <span class="card-price">${fmt(pp.retail)}</span>
          <span class="ws-badge">🏭 批發</span>
        </div>
        ${tiersHtml?`<div class="ws-tiers-mini">${tiersHtml}</div>`:''}`;
      // 一般會員：顯示零售價 + 會員折扣價
      } else if (isMemberRole() && disc > 0) {
        const memberPrice = Math.round(pp.retail * (1-disc/100));
        priceHtml = `<div class="card-price-row">
          <span class="card-price">${fmt(pp.retail)}</span>
          <span class="card-price-member">會員 ${fmt(memberPrice)}</span>
        </div>`;
      // 訪客：只顯示零售價
      } else {
        priceHtml = `<div class="card-price-row">
          <span class="card-price">${fmt(pp.retail)}</span>
        </div>`;
      }
      if (pp.preorder && pp.stock === 0) stockHtml = `<span class="preorder-badge">預購</span>`;
      else if (isOut) stockHtml = `<span class="stock-badge stock-out">缺貨</span>`;
      else if (pp.stock > 0 && pp.stock <= 5) stockHtml = `<span class="stock-badge stock-low">僅剩${pp.stock}件</span>`;
      if (!isOut) cartBtnHtml = `<button class="add-cart-btn" onclick="event.stopPropagation();addToCart('${p.id}')">🛒 加入購物車</button>`;
    }

    card.innerHTML = `
      <div class="img-wrap">
        <div class="skeleton"></div>
        <img src="${imgUrl}" alt="${p.name || p.id}">
        <div class="overlay"><span class="overlay-hint">點擊放大 🔍</span></div>
      </div>
      <div class="card-info">
        <div class="card-id">No. ${p.id}</div>
        <div class="card-name">${p.name || p.id}${stockHtml}</div>
        ${priceHtml}
        ${cat ? `<span class="card-cat-badge" style="background:${cat.color}18;color:${cat.color};border:1px solid ${cat.color}33;"><span style="width:6px;height:6px;border-radius:50%;background:${cat.color};display:inline-block;"></span>${cat.name}</span>` : '<span class="card-cat-badge" style="background:var(--surface2);color:var(--text3);">未分類</span>'}
        ${cartBtnHtml}
      </div>`;

    const img  = card.querySelector('img');
    const wrap = card.querySelector('.img-wrap');
    const markLoaded = () => wrap.classList.add('img-loaded');
    if (img.complete && img.naturalWidth > 0) markLoaded();
    else img.addEventListener('load', markLoaded);
    img.addEventListener('error', () => {
      wrap.classList.add('img-loaded');
      img.style.display = 'none';
      const ph = document.createElement('div');
      ph.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--text3);font-size:12px;';
      ph.innerHTML = '<span style="font-size:2rem">🧸</span>' + p.id;
      wrap.appendChild(ph);
    });
    card.addEventListener('click', () => openLightbox(start + i));
    gallery.appendChild(card);
  });

  currentPage++;
  const remaining = filtered.length - currentPage * PAGE_SIZE;
  const btn = document.getElementById('loadMoreBtn');
  if (remaining > 0) { btn.style.display = 'inline-flex'; btn.textContent = `載入更多（還有 ${remaining} 件）`; }
  else btn.style.display = 'none';
  const ci = document.getElementById('countInfo');
  if (ci) ci.textContent = filtered.length === config.products.length ? `共 ${filtered.length} 件商品 · 持續更新中 ♡` : `搜尋結果 ${filtered.length} 件`;
}

// LIGHTBOX
// ═══════════════════════════════════════
function openLightbox(index) { lbIndex = index; updateLightbox(); document.getElementById('lightbox').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; }
function updateLightbox() {
  const p = filtered[lbIndex];
  if (!p) return;
  const cat = config.categories.find(c => c.id === p.category);
  document.getElementById('lbImg').src    = buildFullUrl(p);
  document.getElementById('lbImg').alt    = p.name || p.id;
  document.getElementById('lbId').textContent     = `No. ${p.id}`;
  document.getElementById('lbName').textContent    = p.name || p.id;
  document.getElementById('lbCat').textContent     = cat ? `✦ ${cat.name}` : '';
  document.getElementById('lbCounter').textContent = `${lbIndex + 1} / ${filtered.length}`;
  const pp = shopDB.productPrices[p.id];
  const priceRow = document.getElementById('lbPriceRow');
  if (pp && pp.retail) {
    priceRow.style.display = 'flex';
    const isOut = pp.stock === 0 && !pp.preorder;
    let priceContent = '';
    if (isWholesale()) {
      // 批發會員：顯示零售價 + 所有批發階梯
      const sortedTiers = (pp.wsTiers||[]).filter(t=>t.qty>0&&t.price>0).sort((a,b)=>a.qty-b.qty);
      const tiersHtml = sortedTiers.length > 0
        ? `<div class="lb-ws-tiers">${sortedTiers.map(t=>`<div class="lb-ws-chip"><div class="lb-ws-chip-qty">≥ ${t.qty} 件</div><div class="lb-ws-chip-price">${fmt(t.price)}</div></div>`).join('')}</div>`
        : '';
      priceContent = `<span class="lb-price">${fmt(pp.retail)}</span>
        <span class="lb-price-ws">🏭 批發專屬階梯</span>
        ${tiersHtml}`;
    } else if (isMemberRole()) {
      // 一般會員：顯示零售價 + 折扣價
      const disc = getTierDiscount(currentUser);
      const memberPrice = disc > 0 ? Math.round(pp.retail * (1-disc/100)) : null;
      priceContent = `<span class="lb-price">${fmt(pp.retail)}</span>
        ${memberPrice ? `<span class="lb-price-member">會員折扣 ${fmt(memberPrice)}</span>` : ''}`;
    } else {
      // 訪客：只顯示零售價
      priceContent = `<span class="lb-price">${fmt(pp.retail)}</span>`;
    }
    priceRow.innerHTML = `
      ${priceContent}
      ${pp.preorder && pp.stock===0 ? '<span class="badge badge-info">可預購</span>' : ''}
      ${!isOut ? `<button class="lb-add-cart" onclick="addToCart('${p.id}');closeLightbox()">🛒 加入購物車</button>` : '<span style="color:#c04040;font-size:13px;">目前缺貨</span>'}`;
  } else {
    priceRow.style.display = 'none';
  }
}
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => { lbIndex = (lbIndex - 1 + filtered.length) % filtered.length; updateLightbox(); });
document.getElementById('lbNext').addEventListener('click', () => { lbIndex = (lbIndex + 1) % filtered.length; updateLightbox(); });
document.getElementById('lightbox').addEventListener('click', e => { if (e.target === document.getElementById('lightbox')) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft')  { lbIndex = (lbIndex - 1 + filtered.length) % filtered.length; updateLightbox(); }
  if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % filtered.length; updateLightbox(); }
});

// ═══════════════════════════════════════
// CART
// ═══════════════════════════════════════
function addToCart(pid) {
  const p = config.products.find(x => x.id === pid);
  if (!p) return;
  const pp = shopDB.productPrices[pid];
  if (!pp || !pp.retail) { showToast('此商品尚未設定價格'); return; }
  if (pp.stock === 0 && !pp.preorder) { showToast('此商品目前缺貨'); return; }
  const existing = cart.find(c => c.id === pid);
  if (existing) existing.qty++;
  else cart.push({ id: pid, name: p.name || pid, url: buildUrl(p), qty: 1, retail: pp.retail, preorder: pp.stock===0 && pp.preorder });
  showToast('✅ 已加入購物車：' + (p.name || pid));
  // refresh header cart badge
  const badge = document.querySelector('.cart-badge');
  const totalQ = cart.reduce((a,c)=>a+c.qty,0);
  if (badge) badge.textContent = totalQ;
  else {
    const cartBtn = document.querySelector('.hdr-btn.primary');
    if (cartBtn) { const b = document.createElement('span'); b.className='cart-badge'; b.textContent=totalQ; cartBtn.appendChild(b); }
  }
}

function openCartModal() {
  renderCartModal();
  openModal('cartModal');
}

function renderCartModal() {
  const body = document.getElementById('cartModalBody');
  if (cart.length === 0) {
    body.innerHTML = `<div style="text-align:center;padding:40px 0">
      <div style="font-size:48px;margin-bottom:12px">🛒</div>
      <p style="color:var(--text2);font-size:14px">購物車是空的</p>
      <button style="margin-top:16px;padding:9px 24px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-family:var(--sans)"
        onclick="closeModal('cartModal')">去逛逛 →</button></div>`;
    return;
  }
  const disc = currentUser ? getTierDiscount(currentUser) : 0;
  let subtotal = 0;
  let itemsHtml = '';
  cart.forEach(item => {
    const eff = getEffectivePrice(item.id, item.qty);
    const rowTotal = eff * item.qty;
    subtotal += rowTotal;
    const priceNote = isWholesale() ? '批發價（依數量）'
      : isMemberRole() && disc > 0 ? `零售 ${fmt(item.retail)} / 會員折扣 ${disc}%`
      : '零售價';
    itemsHtml += `<div class="cart-item">
      <img class="cart-img" src="${item.url}" alt="${item.name}" onerror="this.style.display='none'">
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-id">No. ${item.id}${item.preorder ? ' <span class="badge badge-info">預購</span>' : ''}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${priceNote}</div>
      </div>
      <div class="cart-qty-ctrl">
        <button class="qty-btn" onclick="cartQty('${item.id}',-1)">−</button>
        <span style="font-weight:600;min-width:22px;text-align:center;font-size:14px">${item.qty}</span>
        <button class="qty-btn" onclick="cartQty('${item.id}',1)">+</button>
      </div>
      <div class="cart-item-price">${fmt(rowTotal)}</div>
      <button class="remove-btn" onclick="removeFromCart('${item.id}')">×</button>
    </div>`;
  });

  const discAmt = isMemberRole() ? Math.round(subtotal * disc / 100) : 0;
  const finalTotal = subtotal - discAmt;
  const hasPreorder = cart.some(c => c.preorder);
  const deposit = hasPreorder ? Math.round(finalTotal * 0.5) : 0;

  // 配送方式（依 type 分組）
  const activeLogs = shopDB.logistics.filter(l => l.active);
  const deliveryLogs = activeLogs.filter(l => l.type === 'delivery');
  const cvsLogs     = activeLogs.filter(l => l.type === 'cvs');
  const faceLogs    = activeLogs.filter(l => l.type === 'face');
  const firstLog  = activeLogs[0] || {};
  const firstType = firstLog.type || 'delivery';
  const firstId   = firstLog.id   || '';

  const logRadio = (l, checked) => {
    const feeHtml = l.fee > 0
      ? `<span style="color:var(--text3);font-size:11px;margin-left:6px">+${fmt(l.fee)}</span>`
      : `<span style="color:var(--success);font-size:11px;margin-left:6px"> 免費</span>`;
    return `<label class="radio-item" onclick="onLogisticsChange('${l.type}','${l.id}')">
      <input type="radio" name="logistics" value="${l.id}" ${checked ? 'checked' : ''}>
      <span class="radio-label">${l.name}${feeHtml}</span></label>`;
  };

  let logHtml = '';
  if (deliveryLogs.length > 0) {
    logHtml += `<div style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.05em;padding:6px 0 3px">🚚 宅配</div>
    <div class="radio-group" style="margin-bottom:8px">${deliveryLogs.map((l,i) => logRadio(l, i===0 && firstType==='delivery')).join('')}</div>`;
  }
  if (cvsLogs.length > 0) {
    logHtml += `<div style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.05em;padding:6px 0 3px">🏪 超商取貨</div>
    <div class="radio-group" style="margin-bottom:8px">${cvsLogs.map((l,i) => logRadio(l, deliveryLogs.length===0 && i===0)).join('')}</div>`;
  }
  if (faceLogs.length > 0) {
    logHtml += `<div style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.05em;padding:6px 0 3px">🤝 面交</div>
    <div class="radio-group">${faceLogs.map((l,i) => logRadio(l, deliveryLogs.length===0 && cvsLogs.length===0 && i===0)).join('')}</div>`;
  }

  body.innerHTML = `
    <div>${itemsHtml}</div>
    <div class="cart-summary">
      <div class="summary-row"><span class="label">商品小計</span><span>${fmt(subtotal)}</span></div>
      ${isWholesale() ? `<div class="summary-row"><span class="label" style="color:#2850b0">🏭 批發價格已套用</span><span style="color:#2850b0">依數量階梯計算</span></div>` : ''}
      ${isMemberRole() && disc > 0 ? `<div class="summary-row"><span class="label">會員折扣 (${disc}%)</span><span style="color:var(--success)">−${fmt(discAmt)}</span></div>` : ''}
      ${hasPreorder ? `<div class="summary-row"><span class="label">⚠ 預購訂金 (50%)</span><span style="color:var(--warning)">${fmt(deposit)}</span></div>` : ''}
      <div class="summary-row total"><span>訂單總計</span><span>${fmt(finalTotal)}</span></div>
    </div>
    ${hasPreorder ? `<div class="preorder-notice">⚠ 含預購商品，需先支付 ${fmt(deposit)} 訂金，餘款於出貨前付清</div>` : ''}
    <div class="checkout-section">
      <div class="section-title">配送方式</div>
      ${logHtml}
      <div id="paymentSection" style="margin-top:16px"></div>
      <div id="shippingInfoSection" style="margin-top:16px"></div>
      <button class="btn-full" style="margin-top:16px" onclick="submitOrder()">🌸 確認下單</button>
      ${!currentUser ? `<p style="text-align:center;font-size:12px;color:var(--text3);margin-top:8px">訪客可直接下單，
        <button onclick="closeModal('cartModal');openAuthModal()"
          style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline">登入</button>可享會員折扣</p>` : ''}
    </div>`;

  onLogisticsChange(firstType, firstId);
}



function cartQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) removeFromCart(id);
  else renderCartModal();
}
function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  renderCartModal();
}

// 付款方式依配送類型對應
const PAYMENT_MAP = {
  delivery: ['cod', 'prepay'],           // 宅配：貨到付款、先付款後出貨
  cvs:      ['cod', 'prepay'],           // 超商：貨到付款、先付款後出貨
  face:     ['face_pay', 'transfer_face'] // 面交：面交付款、先轉帳後面交
};

function onLogisticsChange(type, logId) {
  // 更新 radio checked 狀態
  document.querySelectorAll('input[name=logistics]').forEach(r => {
    r.checked = r.value === logId;
  });

  // 渲染對應付款方式
  const allowedPayIds = PAYMENT_MAP[type] || ['cod','prepay'];
  const pays = shopDB.payments.filter(p => p.active && allowedPayIds.includes(p.id));
  const payEl = document.getElementById('paymentSection');
  if (!payEl) return;
  payEl.innerHTML = '<div class="section-title">付款方式</div>'
    + '<div class="radio-group">'
    + pays.map((p, i) =>
        `<label class="radio-item" onclick="onPaymentChange('${p.id}')"><input type="radio" name="payment" value="${p.id}" ${i===0?'checked':''}><span class="radio-label">${p.name}</span></label>`
      ).join('')
    + '</div>'
    + '<div id="transferCodeWrap" style="display:none;margin-top:10px">'
    + '<div class="f-group"><label>匯款後五碼 *</label>'
    + '<input type="text" id="transferCode" maxlength="5" placeholder="匯款帳號後五碼" style="letter-spacing:4px;font-family:var(--mono);font-size:16px;width:160px"></div>'
    + '<div style="font-size:11px;color:var(--text3);margin-top:4px">請先完成匯款再填入後五碼供核對</div>'
    + '</div>';

  // 觸發第一個付款方式的後五碼判斷
  if (pays.length > 0) onPaymentChange(pays[0].id);

  // 渲染收件資訊
  renderShippingInfo(type, logId);
}

function onPaymentChange(payId) {
  document.querySelectorAll('input[name=payment]').forEach(r => { r.checked = r.value === payId; });
  const needCode = payId === 'prepay' || payId === 'transfer_face';
  const wrap = document.getElementById('transferCodeWrap');

}

// 保留舊版相容（不再被呼叫，但避免其他地方引用報錯）
function toggleTransferField() {

function submitOrder() {
  const shipName  = document.getElementById('shipName')?.value.trim();
  const shipPhone = document.getElementById('shipPhone')?.value.trim();
  const logEl = document.querySelector('input[name=logistics]:checked');
  const payEl = document.querySelector('input[name=payment]:checked');
  if (!shipName)  { showToast('❌ 請填寫姓名');   return; }
  if (!shipPhone) { showToast('❌ 請填寫電話');   return; }
  if (!logEl)     { showToast('❌ 請選擇配送方式'); return; }
  if (!payEl)     { showToast('❌ 請選擇付款方式'); return; }

  const logId   = logEl.value;
  const logObj  = shopDB.logistics.find(l => l.id === logId) || {};
  const logType = logObj.type || 'delivery';

  // 收件地址 / 門市資訊
  let shipAddr = '';
  if (logType === 'delivery') {
    shipAddr = document.getElementById('shipAddr')?.value.trim() || '';
    if (!shipAddr) { showToast('❌ 請填寫收件地址'); return; }
  } else if (logType === 'cvs') {
    const storeEl = document.getElementById('cvsStoreName');
    shipAddr = storeEl?.value.trim() || '';
    if (!shipAddr) { showToast('❌ 請填寫或選擇超商門市'); return; }
    shipAddr = '【' + logObj.name + '】' + shipAddr;
  } else {
    shipAddr = document.getElementById('shipAddr')?.value.trim() || '（面交）';
  }

  // 先付款後五碼
  const needsCode = payEl.value === 'prepay' || payEl.value === 'transfer_face';
  const transferCode = document.getElementById('transferCode')?.value.trim() || '';
  if (needsCode && !transferCode) { showToast('❌ 請填寫匯款後五碼'); return; }
  if (needsCode && transferCode.length !== 5) { showToast('❌ 匯款後五碼需為5碼'); return; }

  const disc = isMemberRole() ? getTierDiscount(currentUser) : 0;
  let subtotal = 0;
  const items = cart.map(c => {
    const eff = getEffectivePrice(c.id, c.qty);
    subtotal += eff * c.qty;
    return { id: c.id, name: c.name, qty: c.qty, price: eff, preorder: c.preorder };
  });
  const discAmt = isMemberRole() ? Math.round(subtotal * disc / 100) : 0;
  const final   = subtotal - discAmt;
  const hasPreorder = cart.some(c => c.preorder);
  const order = {
    id: genOrderId(),
    userId:    currentUser ? currentUser.id : 0,
    userName:  shipName,
    userPhone: shipPhone,
    items, subtotal, discount: discAmt, finalTotal: final,
    status:    'pending',
    logistics: logId,
    logisticsName: logObj.name || logId,
    logisticsType: logType,
    logisticsNum:  '',
    payment:   payEl.value,
    payStatus: payEl.value === 'cod' || payEl.value === 'face_pay'
               ? 'unpaid'
               : needsCode ? 'pending_verify' : 'pending_payment',
    transferCode: needsCode ? transferCode : '',
    note: '', createdAt: new Date().toISOString().split('T')[0],
    isPreorder: hasPreorder,
    deposit:    hasPreorder ? Math.round(final * 0.5) : 0,
    address:    shipAddr
  };
  shopDB.orders.push(order);
  if (currentUser) {
    const u = shopDB.users.find(x => x.id === currentUser.id);
    if (u && (order.payStatus === 'pending_verify' || order.payStatus === 'paid')) u.totalSpent += final;
  }
  saveShopDB();
  cart = [];
  closeModal('cartModal');
  const msg = needsCode
    ? `✅ 訂單送出！${order.id}｜後五碼 ${transferCode} 已記錄，待核對`
    : `✅ 訂單送出！${order.id}`;
  showToast(msg, 5000);
  renderApp();
}

function openAuthModal() { openModal('authModal'); }
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function switchAuthTab(tab, btn) {
  document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd   = document.getElementById('loginPwd').value;
  const user  = shopDB.users.find(u => u.email === email && u.pwd === pwd);
  if (!user) { showToast('❌ 帳號或密碼錯誤'); return; }
  if (user.status === 'pending')  { showToast('⏳ 帳號尚未審核，請等待通知'); return; }
  if (user.status === 'disabled') { showToast('❌ 帳號已停用，請聯繫管理員'); return; }
  currentUser = user;
  closeModal('authModal');
  showToast('✅ 歡迎回來，' + user.name + '！');
  renderApp();
}

function doRegister() {
  const name   = document.getElementById('regName').value.trim();
  const email  = document.getElementById('regEmail').value.trim();
  const phone  = document.getElementById('regPhone').value.trim();
  const invite = document.getElementById('regInvite').value.trim();
  const pwd    = document.getElementById('regPwd').value;
  if (!name||!email||!phone||!pwd) { showToast('❌ 請填寫必填欄位'); return; }
  if (shopDB.users.find(u=>u.email===email)) { showToast('❌ 此 Email 已被使用'); return; }
  const newUser = { id: shopDB.users.length+1, name, email, pwd, phone, role:'member', status:'pending', tier:'bronze', totalSpent:0, createdAt: new Date().toISOString().split('T')[0], invite };
  shopDB.users.push(newUser);
  saveShopDB();
  showToast('✅ 申請已送出！等待管理員審核♡', 4000);
}

      </div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:6px">${o.items.map(i=>i.name+'×'+i.qty).join('、')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:6px;align-items:center">${statusMap[o.status]||o.status} ${payMap[o.payStatus]||''}</div>
        <div style="font-weight:700;font-size:14px;color:var(--accent-dark)">${fmt(o.finalTotal)}</div>
      </div>
      ${o.logisticsNum?`<div style="margin-top:6px;font-size:11px;color:var(--text3)">📦 ${logMap[o.logistics]||o.logistics} 單號：<span style="font-family:var(--mono)">${o.logisticsNum}</span></div>`:''}
      ${o.transferCode?`<div style="margin-top:4px;font-size:11px;color:var(--text3)">💳 匯款後五碼：<span style="font-family:var(--mono)">${o.transferCode}</span></div>`:''}
    </div>`).join('');
}

// ═══════════════════════════════════════
// FORGOT PASSWORD
// ═══════════════════════════════════════
function doForgotPassword() {
  const email = document.getElementById('forgotEmail').value.trim();
  const phone = document.getElementById('forgotPhone').value.trim();
  const newPwd = document.getElementById('forgotNewPwd').value;
  const res = document.getElementById('forgotResult');
  if (!email || !phone) { res.innerHTML = '<p style="color:var(--accent-dark);font-size:13px">❌ 請填寫 Email 與電話</p>'; return; }
  if (!newPwd || newPwd.length < 6) { res.innerHTML = '<p style="color:var(--accent-dark);font-size:13px">❌ 新密碼至少需要6碼</p>'; return; }
  const user = shopDB.users.find(u => u.email === email && (u.phone||'').replace(/[-\s]/g,'') === phone.replace(/[-\s]/g,''));
  if (!user) { res.innerHTML = '<p style="color:var(--accent-dark);font-size:13px">❌ 查無符合的帳號，請確認 Email 與電話是否正確</p>'; return; }
  // 建立申請記錄
  if (!shopDB.pwdResetRequests) shopDB.pwdResetRequests = [];
  shopDB.pwdResetRequests.push({
    id: Date.now(),
    userId: user.id,
    userName: user.name,
    email: user.email,
    phone: user.phone,
    newPwd: newPwd,
    status: 'pending',
    createdAt: new Date().toISOString().split('T')[0]
  });
  saveShopDB();
  res.innerHTML = '<div style="background:#eef7f2;border:1px solid #b8dfc9;border-radius:8px;padding:12px;font-size:13px;color:#2d8a5e">✅ 申請已送出！管理員確認後將重設您的密碼，請留意通知。</div>';
  document.getElementById('forgotEmail').value = '';
  document.getElementById('forgotPhone').value = '';
  document.getElementById('forgotNewPwd').value = '';
}

// ═══════════════════════════════════════
// WHOLESALE UPGRADE REQUEST
// ═══════════════════════════════════════
function openWsUpgradeModal() { closeModal('memberModal'); openModal('wsUpgradeModal'); }

function doWsUpgradeRequest() {
  if (!currentUser) return;
  if (!shopDB.wsUpgradeRequests) shopDB.wsUpgradeRequests = [];
  // 檢查是否已有待審核申請
  const existing = shopDB.wsUpgradeRequests.find(r => r.userId === currentUser.id && r.status === 'pending');
  if (existing) { showToast('⏳ 您已有待審核的批發升等申請'); closeModal('wsUpgradeModal'); return; }
  const reason = document.getElementById('wsReason').value.trim();
  shopDB.wsUpgradeRequests.push({
    id: Date.now(),
    userId: currentUser.id,
    userName: currentUser.name,
    email: currentUser.email,
    phone: currentUser.phone,
    reason,
    status: 'pending',
    createdAt: new Date().toISOString().split('T')[0]
  });
  saveShopDB();
  closeModal('wsUpgradeModal');
  showToast('✅ 批發升等申請已送出，等待管理員審核！', 4000);
}
function openLineModal() { document.getElementById('lineModal').classList.add('open'); document.getElementById('lineJoinBtn').onclick = () => window.open(LINE_URL,'_blank','noopener'); }
function closeLineModal(e) { if (e.target === document.getElementById('lineModal')) document.getElementById('lineModal').classList.remove('open'); }
function closeLineModalDirect() { document.getElementById('lineModal').classList.remove('open'); }

// Close modals on background click
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-bg.open, .line-modal-bg.open').forEach(m => m.classList.remove('open'));
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
  }
});

// Scroll to top
window.addEventListener('scroll', () => { document.getElementById('toTop').classList.toggle('show', window.scrollY > 400); });
document.getElementById('toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

init();
</script>
